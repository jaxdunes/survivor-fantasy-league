            }, []);

            useEffect(() => {
                document.body.classList.toggle('theme-tribal', theme === 'tribal');
            }, [theme]);
            const [selectedAddScoreLeagues, setSelectedAddScoreLeagues] = useState(Object.keys(LEAGUES_DATA));
            const [categorySearchTerm, setCategorySearchTerm] = useState('');
            const [selectedCategoryId, setSelectedCategoryId] = useState('');
            const [rulesSearchTerm, setRulesSearchTerm] = useState('');
            const [selectedPlayerIds, setSelectedPlayerIds] = useState([]);
            
            useEffect(() => {
                if (showAddScore) {
                    setSelectedAddScoreLeagues(Object.keys(LEAGUES_DATA));
                    setCategorySearchTerm('');
                    setSelectedCategoryId('');
                    setSelectedPlayerIds([]);
                }
            }, [showAddScore]);

            const filteredScoringCategories = useMemo(() => {
                if (!categorySearchTerm.trim()) return scoringCategories;
                const q = categorySearchTerm.toLowerCase();
                return scoringCategories.filter(cat => 
                    cat.name.toLowerCase().includes(q) || 
                    cat.category.toLowerCase().includes(q)
                );
            }, [categorySearchTerm, scoringCategories]);

            const groupedRules = useMemo(() => {
                const q = rulesSearchTerm.toLowerCase().trim();
                const filtered = !q ? scoringCategories : scoringCategories.filter(cat => 
                    cat.name.toLowerCase().includes(q) || 
                    cat.category.toLowerCase().includes(q)
                );
                const groups = {};
                filtered.forEach(cat => {
                    if (!groups[cat.category]) groups[cat.category] = [];
                    groups[cat.category].push(cat);
                });
                return groups;
            }, [rulesSearchTerm, scoringCategories]);
            
            const ensureArray = (val) => {
                if (!val) return [];
                if (Array.isArray(val)) return val;
                if (typeof val === 'object') return Object.values(val);
                return [];
            };

            // Load season preset data & subscribe to real-time season updates across all leagues
            useEffect(() => {
                let seasonRef;
                const savedLocal = localStorage.getItem(`survivor-seasonData-${activeSeasonId}`);
                const localData = savedLocal ? JSON.parse(savedLocal) : null;

                fetch('seasons/' + activeSeasonId + '.json?t=' + Date.now())
                    .then(res => res.json())
                    .then(presetData => {
                        const initialContestants = (localData?.contestants && ensureArray(localData.contestants).length > 0)
                            ? ensureArray(localData.contestants)
                            : ensureArray(presetData.contestants);
                        const initialCustom = (localData?.customTribes && ensureArray(localData.customTribes).length > 0)
                            ? ensureArray(localData.customTribes)
                            : ensureArray(presetData.customTribes);

                        setSeasonData(prev => {
                            if (prev) return prev;
                            return {
                                ...presetData,
                                ...localData,
                                contestants: initialContestants,
                                customTribes: initialCustom
                            };
                        });

                        if (window.firebaseInitialized) {
                            seasonRef = database.ref(`seasons/${activeSeasonId}`);
                            seasonRef.on('value', (snap) => {
                                if (snap.exists()) {
                                    const fbSeason = snap.val() || {};
                                    const fbContestants = fbSeason.contestants ? ensureArray(fbSeason.contestants) : null;
                                    const fbCustom = fbSeason.customTribes ? ensureArray(fbSeason.customTribes) : null;

                                    setSeasonData(prev => {
                                        const activeContestants = (fbContestants && fbContestants.length > 0)
                                            ? fbContestants
                                            : ((localData?.contestants && ensureArray(localData.contestants).length > 0)
                                                ? ensureArray(localData.contestants)
                                                : (prev?.contestants && prev.contestants.length > 0 ? prev.contestants : ensureArray(presetData.contestants)));

                                        const activeCustom = (fbCustom && fbCustom.length > 0)
                                            ? fbCustom
                                            : ((localData?.customTribes && ensureArray(localData.customTribes).length > 0)
                                                ? ensureArray(localData.customTribes)
                                                : (prev?.customTribes && prev.customTribes.length > 0 ? prev.customTribes : ensureArray(presetData.customTribes)));

                                        const mergedData = {
                                            ...presetData,
                                            ...fbSeason,
                                            contestants: activeContestants,
                                            customTribes: activeCustom
                                        };
                                        localStorage.setItem(`survivor-seasonData-${activeSeasonId}`, JSON.stringify(mergedData));
                                        return mergedData;
                                    });
                                }
                            });
                        }
                    })
                    .catch(err => console.warn('Could not load season json in scoring', err));

                return () => {
                    if (seasonRef) seasonRef.off();
                };
            }, [activeSeasonId]);

            const defaultPlayers = activeSeasonId === 'season-50' ? defaultSeason50Players : defaultSeason51Players;
            const rawContestants = seasonData?.contestants;
            const rawPlayers = (rawContestants && ensureArray(rawContestants).length > 0)
                ? ensureArray(rawContestants)
                : defaultPlayers;
            const players = rawPlayers.map(p => {
                if (p.image) return p;
                const match = defaultPlayers.find(dp => String(dp.id) === String(p.id) || dp.name === p.name);
                return match && match.image ? { ...p, image: match.image } : p;
            });

            const [draftState, setDraftState] = useState({});

            // Load draftState from Firebase / localStorage
            useEffect(() => {
                if (!window.firebaseInitialized) {
                    const savedDS = localStorage.getItem(`survivor-draftState-${activeLeagueId}-${activeSeasonId}`);
                    if (savedDS) setDraftState(JSON.parse(savedDS));
                    return;
                }
                const dsRef = database.ref(`leagues/${activeLeagueId}/seasons/${activeSeasonId}/draftState`);
                dsRef.on('value', (snap) => {
                    setDraftState(snap.val() || {});
                });
                return () => dsRef.off();
            }, [activeLeagueId, activeSeasonId]);

            // Load data from Firebase
            useEffect(() => {
                if (!window.firebaseInitialized) {
                    const saved = localStorage.getItem(`survivor-teams-${activeLeagueId}-${activeSeasonId}`);
                    if (saved) {
                        setPlayerTeams(JSON.parse(saved));
                    }
                    const savedScores = localStorage.getItem(`survivor-scores-${activeLeagueId}-${activeSeasonId}`);
                    if (savedScores) {
                        setScores(JSON.parse(savedScores));
                    }
                    return;
                }
                
                const seasonBasePath = `leagues/${activeLeagueId}/seasons/${activeSeasonId}`;
                
                const teamsRef = database.ref(`${seasonBasePath}/teams`);
                teamsRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setPlayerTeams(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('leagues/jackson-ryan-league/teams').once('value').then(snap => {
                            if (snap.val()) setPlayerTeams(snap.val());
                            else database.ref('teams').once('value').then(legacySnap => setPlayerTeams(legacySnap.val() || {}));
                        });
                    } else {
                        setPlayerTeams({});
                    }
                });
                
                const scoresRef = database.ref(`${seasonBasePath}/scores`);
                scoresRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setScores(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('scores').once('value').then(snap => setScores(snap.val() || {}));
                    } else {
                        setScores({});
                    }
                });
                
                const elimRef = database.ref(`${seasonBasePath}/eliminationOrder`);
                elimRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setEliminationOrder(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('eliminationOrder').once('value').then(snap => setEliminationOrder(snap.val() || {}));
                    } else {
                        setEliminationOrder({});
                    }
                });
                
                const winnerRef = database.ref(`${seasonBasePath}/winner`);
                winnerRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setWinner(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('winner').once('value').then(snap => setWinner(snap.val() || null));
                    } else {
                        setWinner(null);
                    }
                });
                
                const scoredEpisodesRef = database.ref(`${seasonBasePath}/scoredEpisodes`);
                scoredEpisodesRef.on('value', (snapshot) => {
                    setScoredEpisodes(snapshot.val() || {});
                });

                database.ref('currentEpisode').on('value', (snapshot) => {
                    setCurrentEpisode(snapshot.val() || 1);
                });
                
                return () => {
                    teamsRef.off();
                    scoresRef.off();
                    elimRef.off();
                    winnerRef.off();
                    scoredEpisodesRef.off();
                    database.ref('currentEpisode').off();
                };
            }, [activeLeagueId, activeSeasonId]);
            
            // Calculate team scores
            const getTeamScore = (teamId) => {
                const roster = players.filter(p => playerTeams[p.id] === teamId);
                let total = 0;
                
                roster.forEach(player => {
                    const bfEp = getBackfillEpisode(player.id, draftState);
                    const playerScores = scores && (scores[player.id] || scores[String(player.id)]) ? (scores[player.id] || scores[String(player.id)]) : {};
                    
                    if (typeof playerScores === 'object' && playerScores !== null) {
                        Object.keys(playerScores).forEach(ep => {
                            const epNum = parseInt(ep);
                            // Exclude points earned in episodes prior to or during the backfill episode
                            if (bfEp !== null && epNum <= bfEp) return;
                            
                            const episodeScores = playerScores[ep] || {};
                            if (typeof episodeScores === 'object' && episodeScores !== null) {
                                Object.values(episodeScores).forEach(score => {
                                    if (score && typeof score === 'object') {
                                        total += (parseInt(score.points) || 0);
                                    } else if (typeof score === 'number') {
                                        total += score;
                                    }
                                });
                            }
                        });
                    }
                    
                    // Add elimination bonus
                    const elimEp = eliminationOrder && (eliminationOrder[player.id] || eliminationOrder[String(player.id)]);
                    if (elimEp) {
                        const episode = parseInt(elimEp) || 0;
                        if (bfEp === null || episode > bfEp) {
                            total += episode;
                        }
                    }
                });
                
                // Add winner bonus (20 points if winner is on this team)
                if (winner) {
                    const roster = players.filter(p => playerTeams[p.id] === teamId);
                    if (roster.some(p => p.id === parseInt(winner))) {
                        total += 20; // Flat 20 point bonus for having the winner on your team
                    }
                }
                
                return total;
            };
            
            const leaderboard = useMemo(() => {
                return teams.map(team => ({
                    ...team,
                    score: getTeamScore(team.id),
                    roster: players.filter(p => playerTeams[p.id] === team.id)
                })).sort((a, b) => b.score - a.score);
            }, [playerTeams, scores, eliminationOrder, winner, players]);
            
            const getTribeBadgeColor = (tribe) => {
                if (tribe === 'Cila') return 'bg-orange-950/80 text-orange-200 border border-orange-500/60 shadow-sm';
                if (tribe === 'Kalo') return 'bg-teal-950/80 text-teal-200 border border-teal-500/60 shadow-sm';
                if (tribe === 'Vatu') return 'bg-purple-950/80 text-purple-200 border border-purple-500/60 shadow-sm';
                if (tribe === 'Toka') return 'bg-amber-950/80 text-amber-200 border border-amber-500/60 shadow-sm';
                if (tribe === 'Savu') return 'bg-purple-950/80 text-purple-200 border border-purple-500/60 shadow-sm';
                if (tribe === 'Exile Island') return 'bg-slate-900/80 text-slate-200 border border-slate-500/60 shadow-sm';
                return 'bg-slate-800 text-slate-200 border border-slate-600';
            };
            
            const getTribeIcon = (t) => {
                const dotColor = typeof window.getTribeDotColor === 'function' 
                    ? window.getTribeDotColor(t) 
                    : (t === 'Cila' ? 'bg-red-500 border border-red-300' :
                       t === 'Kalo' ? 'bg-blue-500 border border-blue-300' :
                       t === 'Vatu' ? 'bg-purple-600 border border-purple-300' :
                       t === 'Toka' ? 'bg-amber-400 border border-amber-200' :
                       t === 'Savu' ? 'bg-purple-500 border border-purple-300' :
                       t === 'Exile Island' ? 'bg-slate-800 border border-slate-600' :
                       t === 'Unassigned' ? 'bg-slate-400 border border-slate-300' : 'bg-amber-400 border border-amber-200');
                return h('span', { className: `w-2.5 h-2.5 rounded-full inline-block shrink-0 shadow-xs mr-1 ${dotColor}` });
            };

            const playersByTribe = useMemo(() => {
                const map = {};
                const epNum = parseInt(lastSelectedEpisode) || 1;
                players.forEach(p => {
                    const tName = typeof window.getTribeForEpisode === 'function'
                        ? window.getTribeForEpisode(p, epNum)
                        : ((p.tribe && p.tribe !== 'Unassigned') ? p.tribe : (p.startingTribe && p.startingTribe !== 'Unassigned') ? p.startingTribe : 'Unassigned');
                    if (!map[tName]) map[tName] = [];
                    map[tName].push(p);
                });
                return map;
            }, [players, lastSelectedEpisode]);

            const togglePlayerSelected = (playerId) => {
                setSelectedPlayerIds(prev => 
                    prev.includes(playerId) ? prev.filter(id => id !== playerId) : [...prev, playerId]
                );
            };

            const toggleTribeSelected = (tribeName, tribePlayers) => {
                const selectedEpNum = parseInt(lastSelectedEpisode) || 1;
                const activeTribePlayerIds = tribePlayers
                    .filter(p => !eliminationOrder[p.id] || parseInt(eliminationOrder[p.id]) >= selectedEpNum)
                    .map(p => p.id);
                if (activeTribePlayerIds.length === 0) return;

                const allSelected = activeTribePlayerIds.every(id => selectedPlayerIds.includes(id));
                if (allSelected) {
                    setSelectedPlayerIds(prev => prev.filter(id => !activeTribePlayerIds.includes(id)));
                } else {
                    setSelectedPlayerIds(prev => {
                        const newSet = new Set([...prev, ...activeTribePlayerIds]);
                        return Array.from(newSet);
                    });
                }
            };

            const toggleTeamExpanded = (teamId) => {
                setExpandedTeams(prev => ({ ...prev, [teamId]: !prev[teamId] }));
            };

            const getPlayerTribeProgression = (player) => {
                if (!player) return [];
                if (typeof window.getPlayerTribeProgression === 'function') {
                    return window.getPlayerTribeProgression(player);
                }
                if (player.tribeHistory && Array.isArray(player.tribeHistory) && player.tribeHistory.length > 0) {
                    return player.tribeHistory;
                }
                const start = player.startingTribe || player.tribe || 'Unassigned';
                const curr = player.tribe || player.startingTribe || 'Unassigned';
                if (start !== curr && curr !== 'Unassigned') {
                    return [
                        { episode: 1, tribe: start, type: 'starting', label: `Starting Tribe: ${start}` },
                        { episode: 2, tribe: curr, type: 'swap', label: `Swapped to ${curr}` }
                    ];
                }
                return [{ episode: 1, tribe: start, type: 'starting', label: `Starting Tribe: ${start}` }];
            };
            
            const getPlayerScore = (playerId) => {
                const pId = parseInt(playerId);
                const bfEp = getBackfillEpisode(playerId, draftState);
                const playerScores = scores && (scores[playerId] || scores[pId]) ? (scores[playerId] || scores[pId]) : {};
                let total = 0;
                
                if (typeof playerScores === 'object' && playerScores !== null) {
                    Object.keys(playerScores).forEach(ep => {
                        const epNum = parseInt(ep);
                        if (bfEp !== null && epNum <= bfEp) return; // Exclude pre-backfill points from team score
                        
                        const episodeScores = playerScores[ep];
                        if (typeof episodeScores === 'object' && episodeScores !== null) {
                            Object.values(episodeScores).forEach(score => {
                                if (score && typeof score === 'object') {
                                    total += (parseInt(score.points) || 0);
                                } else if (typeof score === 'number') {
                                    total += score;
                                }
                            });
                        }
                    });
                }
                
                // Add elimination bonus
                const elimEp = eliminationOrder && (eliminationOrder[playerId] || eliminationOrder[pId]);
                if (elimEp) {
                    const episode = parseInt(elimEp) || 0;
                    if (bfEp === null || episode > bfEp) {
                        total += episode;
                    }
                }
                
                return total;
            };
            
            const isFinishedSeason = (seasonData && seasonData.status === 'finished') || (seasonConfig && seasonConfig.status === 'previous') || activeSeasonId === 'season-50';

            const getPlayerBreakdown = (playerId) => {
                const pId = parseInt(playerId);
                const bfEp = getBackfillEpisode(playerId, draftState);
                const playerScores = scores && (scores[playerId] || scores[pId]) ? (scores[playerId] || scores[pId]) : {};
                const breakdown = [];
                
                if (typeof playerScores === 'object' && playerScores !== null) {
                    Object.keys(playerScores).forEach(ep => {
                        const epNum = parseInt(ep);
                        const isPreBackfill = bfEp !== null && epNum <= bfEp;
                        const episodeScores = playerScores[ep] || {};
                        if (typeof episodeScores === 'object' && episodeScores !== null) {
                            Object.keys(episodeScores).forEach(scoreId => {
                                const score = episodeScores[scoreId];
                                if (score && typeof score === 'object') {
                                    const pts = parseInt(score.points) || 0;
                                    breakdown.push({
                                        episode: epNum,
                                        scoreId: scoreId,
                                        playerId: playerId,
                                        category: score.category || 'Points',
                                        points: isPreBackfill ? 0 : pts,
                                        originalPoints: pts,
                                        isPreBackfill: isPreBackfill,
                                        note: (score.note || '') + (isPreBackfill ? ' (Earned prior to backfill - 0 pts for team)' : ''),
                                        canDelete: !isFinishedSeason
                                    });
                                }
                            });
                        }
                    });
                }

                // Add tribe swap & merge events
                if (players && Array.isArray(players)) {
                    const playerObj = players.find(p => p && (p.id === playerId || p.id === pId));
                    if (playerObj) {
                        const progression = getPlayerTribeProgression(playerObj);
                        progression.forEach(th => {
                            if (th && (th.type === 'swap' || th.type === 'merge')) {
                                breakdown.push({
                                    episode: th.episode || 1,
                                    category: th.type === 'merge' ? `🏝️ Reached Merge (${th.tribe} Tribe)` : `🔄 Tribe Swap (${th.tribe} Tribe)`,
                                    points: 0,
                                    note: th.label || `Transferred to ${th.tribe}`
                                });
                            }
                        });
                    }
                }
                
                // Add elimination bonus if exists
                const elimEp = eliminationOrder && (eliminationOrder[playerId] || eliminationOrder[pId]);
                if (elimEp) {
                    const episode = parseInt(elimEp) || 1;
                    const isPreBackfill = bfEp !== null && episode <= bfEp;
                    const placement = Math.max(1, 25 - episode);
                    breakdown.push({
                        episode: episode,
                        category: 'Elimination Bonus',
                        points: isPreBackfill ? 0 : episode,
                        originalPoints: episode,
                        isPreBackfill: isPreBackfill,
                        note: `Placed ${placement}th (Episode ${episode})` + (isPreBackfill ? ' (Earned prior to backfill)' : '')
                    });
                }
                
                // Add winner bonus if this player won
                if (winner && (parseInt(winner) === playerId || parseInt(winner) === pId)) {
                    breakdown.push({
                        episode: 14,
                        category: 'Winner Bonus',
                        points: 20,
                        note: 'Sole Survivor! 🔥'
                    });
                }
                
                return breakdown.sort((a, b) => (a.episode || 0) - (b.episode || 0));
            };
            
            // Helper to check if a category is an elimination category
            const isEliminationCategory = (catName) => {
                if (!catName) return false;
                const lower = catName.toLowerCase();
                if (lower.includes('first voted out')) return false;
                return (
                    lower === 'voted-out' ||
                    lower === 'medevac' ||
                    lower === 'expelled' ||
                    lower.includes('voted out') ||
                    lower.includes('medevac') ||
                    lower.includes('expelled') ||
                    lower.includes('medical removed')
                );
            };

            const isWinnerCategory = (catName) => {
                if (!catName) return false;
                const lower = catName.toLowerCase();
                return lower === 'sole-survivor' || lower.includes('sole survivor');
            };

            // Delete a score entry
            const deleteScore = async (playerId, episode, scoreId) => {
                if (isFinishedSeason) return;
                if (!confirm('Are you sure you want to delete this score entry?')) {
                    return;
                }
                
                if (window.firebaseInitialized) {
                    try {
                        const baseRef = `leagues/${activeLeagueId}/seasons/${activeSeasonId}`;
                        
                        // 1. Remove the score entry from Firebase
                        await database.ref(`${baseRef}/scores/${playerId}/${episode}/${scoreId}`).remove();

                        // 2. Fetch remaining scores for this player
                        const playerScoresSnap = await database.ref(`${baseRef}/scores/${playerId}`).once('value');
                        const playerScores = playerScoresSnap.val() || {};

                        // 3. Scan remaining scores for elimination and winner events
                        let remainingElimEpisodes = [];
                        let hasWinnerScore = false;

                        Object.entries(playerScores).forEach(([ep, epScores]) => {
                            if (epScores && typeof epScores === 'object') {
                                Object.values(epScores).forEach(scoreItem => {
                                    if (scoreItem && scoreItem.category) {
                                        if (isEliminationCategory(scoreItem.category)) {
                                            remainingElimEpisodes.push(parseInt(ep));
                                        }
                                        if (isWinnerCategory(scoreItem.category)) {
                                            hasWinnerScore = true;
                                        }
                                    }
                                });
                            }
                        });

                        // 4. Update or remove eliminationOrder for this player
                        if (remainingElimEpisodes.length > 0) {
                            const earliestEp = Math.min(...remainingElimEpisodes);
                            await database.ref(`${baseRef}/eliminationOrder/${playerId}`).set(earliestEp);
                        } else {
                            // No remaining elimination scores for this player -> remove elimination status
                            await database.ref(`${baseRef}/eliminationOrder/${playerId}`).remove();

                            // Revert backfill if a player was backfilled due to this player's elimination
                            const dsSnap = await database.ref(`${baseRef}/draftState`).once('value');
                            const ds = dsSnap.val() || {};
                            if (ds.backfilledPlayers) {
                                let backfilledPlayerIdToRemove = null;
                                Object.entries(ds.backfilledPlayers).forEach(([bfId, info]) => {
                                    if (info && (info.replacedPlayerId == playerId || String(info.replacedPlayerId) === String(playerId))) {
                                        backfilledPlayerIdToRemove = bfId;
                                    }
                                });

                                if (backfilledPlayerIdToRemove) {
                                    delete ds.backfilledPlayers[backfilledPlayerIdToRemove];
                                    const teamsSnap = await database.ref(`${baseRef}/teams`).once('value');
                                    const currentTeams = teamsSnap.val() || {};
                                    delete currentTeams[backfilledPlayerIdToRemove];

                                    await Promise.all([
                                        database.ref(`${baseRef}/teams`).set(currentTeams),
                                        database.ref(`${baseRef}/draftState`).set(ds)
                                    ]);
                                }
                            }
                        }

                                                            selectedCategoryId === cat.id ? 'bg-white/20 text-white' : cat.points > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'

                                    ),

                                    h('div', {},
                                        h('label', { className: 'block text-sm font-bold text-gray-700 mb-2' }, 'Points'),
                                        h('input', {
                                            id: 'points-input',
                                            type: 'number',
                                            className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-orange-500 focus:outline-none',
                                            placeholder: 'Auto-filled by category'
                                        })
                                    ),
                                    
                                    // Optional Note
                                    h('div', {},
                                        h('label', { className: 'block text-sm font-bold text-gray-700 mb-2' }, 'Note (Optional)'),
                                        h('input', {
                                            id: 'note-input',

                                            className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-orange-500 focus:outline-none',

                                    // Mark Episode as Scored Checkbox
                                    h('div', { className: 'flex items-center gap-2 pt-2' },
                                        h('input', {
                                            id: 'notify-scored-checkbox',
                                            type: 'checkbox',
                                            className: 'w-4 h-4 text-orange-600 rounded focus:ring-orange-500 cursor-pointer'
                                        }),
                                        h('label', { htmlFor: 'notify-scored-checkbox', className: 'text-xs font-bold text-gray-700 cursor-pointer' },
                                            'Mark Episode as Scored & Send Push Notification to League 🏆'
                                        )
                                    ),
                                    
                                    // Submit Button
                                    h('button', {
                                        onClick: () => {
                                            if (!selectedAddScoreLeagues.length) {
                                                alert('Please select at least one league to apply points.');
                                                return;
                                            }
                                            
                                            const targetPlayerIds = selectedPlayerIds;
                                            
                                            const episode = document.getElementById('episode-select').value;
                                            const categoryId = document.getElementById('category-select').value;
                                            const points = parseInt(document.getElementById('points-input').value);
                                            const note = document.getElementById('note-input').value;
                                            const notifyScored = document.getElementById('notify-scored-checkbox') ? document.getElementById('notify-scored-checkbox').checked : false;
                                            
                                            if (targetPlayerIds.length === 0 || !episode || !categoryId || isNaN(points)) {
                                                alert(targetPlayerIds.length === 0 ? 'Please select at least one player.' : 'Please fill in all required fields');
                                                return;
                                            }
                                            
                                            const category = scoringCategories.find(c => c.id === categoryId);
                                            const scoreId = Date.now().toString();
                                            const catName = (category ? category.name : '').toLowerCase();

                                            // Auto-implied elimination & winner
                                            const isElimination = (categoryId === 'voted-out' || categoryId === 'medevac' || categoryId === 'expelled' || (catName.includes('voted out') && !catName.includes('first voted out'))) && categoryId !== 'first-voted-out';
                                            const isWinner = categoryId === 'sole-survivor' || catName.includes('sole survivor');
                                            
                                            if (window.firebaseInitialized) {
                                                const promises = [];
                                                if (notifyScored) {
                                                    selectedAddScoreLeagues.forEach(leagueId => {
                                                        const scoredRef = `leagues/${leagueId}/seasons/${activeSeasonId}/scoredEpisodes/${episode}`;
                                                        promises.push(
                                                            database.ref(scoredRef).set({
                                                                scoredAt: Date.now(),
                                                                scoredBy: (typeof firebase !== 'undefined' && typeof firebase.auth === 'function' && firebase.auth().currentUser) ? (firebase.auth().currentUser.displayName || firebase.auth().currentUser.email || 'Admin') : 'Admin',
                                                                status: 'completed'
                                                            })
                                                        );
                                                    });
                                                }
                                                targetPlayerIds.forEach(playerId => {
                                                    selectedAddScoreLeagues.forEach(leagueId => {
                                                        const baseRef = `leagues/${leagueId}/seasons/${activeSeasonId}`;
                                                        promises.push(
                                                            database.ref(`${baseRef}/scores/${playerId}/${episode}/${scoreId}`).set({
                                                                category: category ? category.name : 'Custom',
                                                                points: points,
                                                                note: note || ''
                                                            })
                                                        );
                                                        if (isElimination) {
                                                            promises.push(database.ref(`${baseRef}/eliminationOrder/${playerId}`).set(parseInt(episode)));
                                                            
                                                            // Post-draft Auto-Backfill Engine
                                                            promises.push(
                                                                database.ref(`${baseRef}/draftState`).once('value').then(dsSnap => {
                                                                    const ds = dsSnap.val() || {};
                                                                    if (ds.status === 'finalized' && ds.backfillEnabled !== false) {
                                                                        return database.ref(`${baseRef}/teams`).once('value').then(tSnap => {
                                                                            const currentTeams = tSnap.val() || {};
                                                                            const eliminatedTeamId = currentTeams[playerId];
                                                                            if (eliminatedTeamId) {
                                                                                const unassigned = players.filter(p => !currentTeams[p.id]).sort((a,b) => parseInt(a.id) - parseInt(b.id));
                                                                                if (unassigned.length > 0) {
                                                                                    const backfillP = unassigned[0];
                                                                                    currentTeams[backfillP.id] = eliminatedTeamId;
                                                                                    ds.backfilledPlayers = ds.backfilledPlayers || {};
                                                                                    ds.backfilledPlayers[backfillP.id] = {
                                                                                        episode: parseInt(episode),
                                                                                        replacedPlayerId: playerId,
                                                                                        timestamp: Date.now()
                                                                                    };
                                                                                    return Promise.all([
                                                                                        database.ref(`${baseRef}/teams`).set(currentTeams),
                                                                                        database.ref(`${baseRef}/draftState`).set(ds)
                                                                                    ]);
                                                                                }
                                                                            }
                                                                        });
                                                                    }
                                                                })
                                                            );
                                                        }
                                                        if (isWinner) {
                                                            promises.push(database.ref(`${baseRef}/winner`).set(parseInt(playerId)));
                                                        }
                                                    });
                                                });
                                                
                                                Promise.all(promises).then(() => {
                                                    if (document.getElementById('player-select')) {
                                                        document.getElementById('player-select').value = '';
                                                    }
                                                    if (document.getElementById('episode-select')) {
                                                        document.getElementById('episode-select').value = episode;
                                                    }
                                                    document.getElementById('category-select').value = '';
                                                    document.getElementById('points-input').value = '';
                                                    document.getElementById('note-input').value = '';
                                                    if (document.getElementById('notify-scored-checkbox')) {
                                                        document.getElementById('notify-scored-checkbox').checked = false;
                                                    }
                                                    setSelectedCategoryId('');
                                                    setCategorySearchTerm('');
                                                    setSelectedPlayerIds([]);
                                                    setShowAddScore(false);
                                                    
                                                    const leagueNames = selectedAddScoreLeagues.map(id => (LEAGUES_DATA[id] || {}).name || id).join(', ');
                                                    let msg = `Points added successfully for ${targetPlayerIds.length} player(s) in: ${leagueNames}! 🎉`;
                                                    if (isElimination) msg += ' (Player(s) marked as eliminated & lowest Cast ID backfilled!)';
                                                    if (isWinner) msg += ' (Player marked as Sole Survivor!)';
                                                    alert(msg);
                                                });
                                            } else {
                                                targetPlayerIds.forEach(playerId => {
                                                    selectedAddScoreLeagues.forEach(leagueId => {
                                                        const key = `survivor-scores-${leagueId}-${activeSeasonId}`;
                                                        const existing = JSON.parse(localStorage.getItem(key) || '{}');
                                                        if (!existing[playerId]) existing[playerId] = {};
                                                        if (!existing[playerId][episode]) existing[playerId][episode] = {};
                                                        existing[playerId][episode][scoreId] = {
                                                            category: category ? category.name : 'Custom',
                                                            points: points,
                                                            note: note || ''
                                                        };
                                                        localStorage.setItem(key, JSON.stringify(existing));

                                                        if (isElimination) {
                                                            const elimKey = `survivor-elimination-${leagueId}-${activeSeasonId}`;
                                                            const elims = JSON.parse(localStorage.getItem(elimKey) || '{}');
                                                            elims[playerId] = parseInt(episode);
                                                            localStorage.setItem(elimKey, JSON.stringify(elims));
                                                        }
                                                        if (isWinner) {
                                                            const winKey = `survivor-winner-${leagueId}-${activeSeasonId}`;
                                                            localStorage.setItem(winKey, JSON.stringify(playerId));
                                                        }
                                                    });
                                                });
                                                
                                                if (document.getElementById('player-select')) {
                                                    document.getElementById('player-select').value = '';
                                                }
                                                if (document.getElementById('episode-select')) {
                                                    document.getElementById('episode-select').value = episode;
                                                }
                                                document.getElementById('category-select').value = '';
                                                document.getElementById('points-input').value = '';
                                                document.getElementById('note-input').value = '';
                                                setSelectedCategoryId('');
                                                setCategorySearchTerm('');
                                                setSelectedPlayerIds([]);
                                                setShowAddScore(false);
                                                
                                                const leagueNames = selectedAddScoreLeagues.map(id => (LEAGUES_DATA[id] || {}).name || id).join(', ');
                                                let msg = `Points added successfully for ${targetPlayerIds.length} player(s) in: ${leagueNames}! 🎉`;
                                                if (isElimination) msg += ' (Player(s) marked as eliminated)';
                                                if (isWinner) msg += ' (Player marked as Sole Survivor!)';
                                                alert(msg);
                                            }
                                        },
                                        className: 'w-full px-6 py-3 bg-gradient-to-r from-orange-500 to-amber-600 text-white rounded-xl font-bold hover:shadow-lg transition text-lg'
                                    }, 'Add Points')
                                )
                            )
                        )
                    ),
                    
                    // Floating Side Menu Trigger Tab (Always visible on left edge when closed)
                    !showSideMenu && h('button', {
                        onClick: () => setShowSideMenu(true),
                        className: 'fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-gradient-to-r from-orange-500 to-amber-600 text-white py-3 px-2 rounded-r-2xl shadow-2xl hover:pr-3.5 transition-all flex items-center gap-2 font-bold text-xs border-y border-r border-white/30 cursor-pointer group',
                        title: 'Open Leagues Menu'
                    },

                        h('span', { className: 'hidden md:inline font-black tracking-wider text-[10px] uppercase' }, 'Leagues')
                    ),

                    // Side Menu Panel (Always docked on side when toggled, openable and closable)
                    h(Fragment, {},

                        showSideMenu && h('div', {
                            className: 'fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity',
                            onClick: () => setShowSideMenu(false)
                        }),
                        
                        // Side Menu Sidebar Panel
                        h('aside', {
                            className: `fixed top-0 left-0 bottom-0 w-80 max-w-[85vw] bg-slate-900 text-white shadow-2xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col justify-between overflow-y-auto border-r border-slate-800 ${
                                showSideMenu ? 'translate-x-0' : '-translate-x-full'
                            }`
                        },
                            h('div', { className: 'p-6' },
                                // Header
                                h('div', { className: 'flex justify-between items-center mb-6 pb-4 border-b border-slate-800' },
                                    h('div', { className: 'flex items-center gap-2.5' },
                                        h('div', { className: 'w-9 h-9 rounded-xl bg-orange-500/20 flex items-center justify-center text-orange-400 border border-orange-500/30' },
                                            h(Icons.Trophy, { size: 20 })
                                        ),
                                        h('div', {},
                                            h('h2', { className: 'text-base font-black text-white leading-tight' }, 'Leagues & Seasons'),
                                            h('p', { className: 'text-[11px] text-slate-400 font-semibold' }, 'Survivor Fantasy League')
                                        )

                                    h('button', {
                                        onClick: () => setShowSideMenu(false),
                                        className: 'p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition cursor-pointer'
                                    }, h(Icons.X, { size: 18 }))
                                ),

                                // Leagues & Seasons List
                                h('div', { className: 'space-y-4' },
                                    h('div', { className: 'text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1' }, 'Leagues & Seasons'),
                                    Object.values(LEAGUES_DATA).map(league => {
                                        const isLeagueActive = league.id === activeLeagueId;
                                        const availableSeasons = league.seasons || [{ id: 'season-51', name: 'Season 51: Open Era', label: 'Season 51' }];

                                                        className: `w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-between cursor-pointer ${
                                                            isSeasonActive
                                                                ? 'bg-gradient-to-r from-orange-500 to-amber-600 text-white font-bold shadow-md'
                                                                : 'bg-slate-900/60 text-slate-300 hover:bg-slate-700/60 hover:text-white border border-slate-700/40'

                                                    },
                                                        h('div', { className: 'flex items-center gap-2' },
                                                            h('span', {}, season.status === 'current' ? '🔥' : '📜'),
                                                            h('span', {}, season.name || season.label)

                                                        isSeasonActive && h(Icons.Check, { size: 14 })
                                                    );
                                                })
                                            )
                                        );
                                    })
                                )
                            ),

                            // Sidebar Footer with Theme Toggle & Mobile App Button
                            h('div', { className: 'p-4 border-t border-slate-800 bg-slate-950/80 space-y-3' },
                                h('button', {
                                    type: 'button',
                                    onClick: () => setShowInstallModal(true),
                                    className: 'w-full py-2.5 px-3 bg-gradient-to-r from-orange-500/20 to-amber-500/20 hover:from-orange-500/30 hover:to-amber-500/30 border border-orange-500/40 rounded-xl text-xs font-bold text-orange-300 hover:text-white transition flex items-center justify-center gap-2 cursor-pointer shadow-sm group'
                                },
                                    h('span', { className: 'text-base group-hover:scale-110 transition-transform' }, '📱'),
                                    h('span', {}, 'Want This As A Mobile App?')
                                ),
                                h('div', { className: 'flex items-center justify-between mb-1 bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 shadow-inner' },
                                    h('div', { className: 'flex items-center gap-2.5' },
                                        h('span', { className: 'text-lg' }, '🔥'),
                                        h('div', {},

                                            h('div', { className: 'text-[10px] text-amber-400 font-semibold' }, theme === 'tribal' ? 'Torchlight Mode' : 'Classic Mode')
                                        )
                                    ),

                                            setTheme(nextTheme);
                                            localStorage.setItem('survivor_theme', nextTheme);

                                            theme === 'tribal' ? 'bg-gradient-to-r from-orange-500 to-amber-500 ring-2 ring-orange-400/40' : 'bg-slate-700'
                                        }`
                                    },

                                                theme === 'tribal' ? 'translate-x-5' : 'translate-x-0'
                                            }`
                                        })
                                    )
                                ),
                                h('div', { className: 'text-center text-[10px] text-slate-500 font-semibold' },
                                    h('div', { className: 'flex items-center justify-center gap-2 mb-1 text-slate-400' },
                                        h('span', { className: 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' }),
                                        h('span', {}, `${(LEAGUES_DATA[activeLeagueId] || {}).name} • ${activeSeasonId.toUpperCase()}`)
                                    ),
                                    'Fantasy Survivor App'
                                )
                            )
                        )
                    ),

                    // Footer
                    h('div', { className: 'mt-12 text-center text-gray-900' },
                        h('p', { className: 'text-sm text-gray-700' }, 'Survivor 51: Open Era • Scoring Tracker & Leaderboard')
                    ),

                    // Install App Modal
                    h(InstallAppModal, {
                        isOpen: showInstallModal,
                        onClose: () => setShowInstallModal(false)
                    })
                )
            );
        }
        
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return h('div', { className: 'p-6 bg-red-900 text-white rounded-2xl m-4 max-w-4xl mx-auto shadow-2xl border border-red-500 my-12' },
                        h('h2', { className: 'text-2xl font-bold mb-2 flex items-center gap-2' }, '⚠️ Scoring Page Render Error'),
                        h('p', { className: 'text-sm font-mono bg-black/50 p-4 rounded-xl text-red-200 overflow-x-auto mb-4' }, String(this.state.error && this.state.error.stack ? this.state.error.stack : this.state.error)),
                        h('button', {
                            className: 'px-5 py-2.5 bg-white text-red-950 font-black rounded-xl hover:bg-red-100 transition shadow-md cursor-pointer',
                            onClick: () => this.setState({ hasError: false, error: null })
                        }, '🔄 Try Again / Reset')
                    );
                }
                return this.props.children;
            }
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(ErrorBoundary, null, h(ScoringPage)));
    }
    </script>
    
    <!-- PWA Service Worker -->
    <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
            .then((registration) => {
                console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
                console.error('Service Worker registration failed:', error);
            });
    }

    // Detect if running as installed PWA
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running as installed PWA');
    }
    </script>
