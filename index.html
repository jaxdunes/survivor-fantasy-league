                                    category: th.type === 'merge' ? `🏝️ Reached Merge (${th.tribe} Tribe)` : `🔄 Tribe Swap (${th.tribe} Tribe)`,
                                    points: 0,
                                    note: th.label || `Transferred to ${th.tribe}`
                                });
                            }
                        });
                    }
                }
                
                // Add elimination bonus if eliminated <= viewingEpisode
                const elimEp = activeEliminationOrder && (activeEliminationOrder[playerId] || activeEliminationOrder[pId]);
                if (elimEp) {
                    const episode = parseInt(elimEp) || 1;
                    const isPreBackfill = bfEp !== null && episode < bfEp;
                    const placement = Math.max(1, 25 - episode);
                    breakdown.push({
                        episode: episode,
                        category: 'Elimination Bonus',
                        points: isPreBackfill ? 0 : episode,
                        originalPoints: episode,
                        isPreBackfill: isPreBackfill,
                        note: `Placed ${placement}th (Episode ${episode})` + (isPreBackfill ? ' (Earned prior to backfill)' : '')
                    });
                }
                
                // Add winner bonus if this player won and viewingEpisode reaches finale
                if (activeWinner && (parseInt(activeWinner) === playerId || parseInt(activeWinner) === pId)) {
                    breakdown.push({
                        episode: 14,
                        category: 'Winner Bonus',
                        points: 20,
                        note: 'Sole Survivor! 🔥'
                    });
                }
                
                return breakdown.sort((a, b) => (a.episode || 0) - (b.episode || 0));
            };
            
            // Helper to check if a category is an elimination category
            const isEliminationCategory = (catName) => {
                if (!catName) return false;
                const lower = catName.toLowerCase();
                if (lower.includes('first voted out')) return false;
                return (
                    lower === 'voted-out' ||
                    lower === 'medevac' ||
                    lower === 'expelled' ||
                    lower.includes('voted out') ||
                    lower.includes('medevac') ||
                    lower.includes('expelled') ||
                    lower.includes('medical removed')
                );
            };

            const isWinnerCategory = (catName) => {
                if (!catName) return false;
                const lower = catName.toLowerCase();
                return lower === 'sole-survivor' || lower.includes('sole survivor');
            };

            // Delete a score entry
            const deleteScore = async (playerId, episode, scoreId) => {
                if (isFinishedSeason) return;
                if (!confirm('Are you sure you want to delete this score entry?')) {
                    return;
                }
                
                if (window.firebaseInitialized) {
                    try {
                        const baseRef = `leagues/${activeLeagueId}/seasons/${activeSeasonId}`;
                        
                        // 1. Remove the score entry from Firebase
                        await database.ref(`${baseRef}/scores/${playerId}/${episode}/${scoreId}`).remove();

                        // 2. Fetch remaining scores for this player
                        const playerScoresSnap = await database.ref(`${baseRef}/scores/${playerId}`).once('value');
                        const playerScores = playerScoresSnap.val() || {};

                        // 3. Scan remaining scores for elimination and winner events
                        let remainingElimEpisodes = [];
                        let hasWinnerScore = false;

                        Object.entries(playerScores).forEach(([ep, epScores]) => {
                            if (epScores && typeof epScores === 'object') {
                                Object.values(epScores).forEach(scoreItem => {
                                    if (scoreItem && scoreItem.category) {
                                        if (isEliminationCategory(scoreItem.category)) {
                                            remainingElimEpisodes.push(parseInt(ep));
                                        }
                                        if (isWinnerCategory(scoreItem.category)) {
                                            hasWinnerScore = true;
                                        }
                                    }
                                });
                            }
                        });

                        // 4. Update or remove eliminationOrder for this player
                        if (remainingElimEpisodes.length > 0) {
                            const earliestEp = Math.min(...remainingElimEpisodes);
                            await database.ref(`${baseRef}/eliminationOrder/${playerId}`).set(earliestEp);
                        } else {
                            // No remaining elimination scores for this player -> remove elimination status
                            await database.ref(`${baseRef}/eliminationOrder/${playerId}`).remove();

                            // Revert backfill if a player was backfilled due to this player's elimination
                            const dsSnap = await database.ref(`${baseRef}/draftState`).once('value');
                            const ds = dsSnap.val() || {};
                            if (ds.backfilledPlayers) {
                                let backfilledPlayerIdToRemove = null;
                                Object.entries(ds.backfilledPlayers).forEach(([bfId, info]) => {
                                    if (info && (info.replacedPlayerId == playerId || String(info.replacedPlayerId) === String(playerId))) {
                                        backfilledPlayerIdToRemove = bfId;
                                    }
                                });

                                if (backfilledPlayerIdToRemove) {
                                    delete ds.backfilledPlayers[backfilledPlayerIdToRemove];
                                    const teamsSnap = await database.ref(`${baseRef}/teams`).once('value');
                                    const currentTeams = teamsSnap.val() || {};
                                    delete currentTeams[backfilledPlayerIdToRemove];

                                    await Promise.all([
                                        database.ref(`${baseRef}/teams`).set(currentTeams),
                                        database.ref(`${baseRef}/draftState`).set(ds)
                                    ]);
                                }
                            }
                        }

                        // 5. Update or remove winner status if this player was marked as winner
                        if (!hasWinnerScore) {
                            const winnerSnap = await database.ref(`${baseRef}/winner`).once('value');
                            const currentWinner = winnerSnap.val();
                            if (currentWinner == playerId || String(currentWinner) === String(playerId)) {
                                await database.ref(`${baseRef}/winner`).remove();
                            }
                        }

                        alert('Score deleted successfully!');
                    } catch (err) {
                        console.error('Error deleting score:', err);
                        alert('Error deleting score. Please try again.');
                    }
                }
            };

                        const scoreRef = `leagues/${lId}/seasons/${activeSeasonId}/scores/${playerId}/${episode}/${scoreId}`;
                        const snap = await database.ref(scoreRef).once('value');
                        if (snap.exists()) {
                            await database.ref(`${scoreRef}/note`).set(trimmedNote);
                        }
                    });
                    
                    await Promise.all(promises);
                    setEditingNoteScoreKey(null);
                    setEditingNoteValue('');
                } catch (err) {
                    console.error('Error updating score note:', err);
                    alert('Error updating score note. Please try again.');

                }
            };

                                                                                        timestamp: Date.now()

                                                                                        database.ref(`${baseRef}/draftState`).set(ds)
                                                                                    ]);

                                            Array.from({ length: 14 }, (_, i) => i + 1).map(ep => 
                                                h('option', { key: ep, value: ep }, `Episode ${ep}`)
                                            )
                                        )
                                    ),
                                    h('div', { className: 'text-xs text-amber-400/90 font-semibold' }, '🖐️ Drag player buttons between containers below:')
                                ),

                                // Tribe Shape Containers Grid (Competing Tribes Top, Merge Tribe Bottom)
                                (() => {
                                    const activePlayersForEp = players.filter(p => {
                                        const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                                        return !elimEp || parseInt(elimEp) >= parseInt(bulkEditEpisode);
                                    });

                                    const isMergeName = (name) => {
                                        const lower = (name || '').toLowerCase();
                                        return lower === 'merge' || lower === 'merge tribe' || lower.includes('merge');
                                    };

                                    const competingTribes = availableTribes.filter(t => !isMergeName(t) && t !== 'Unassigned');
                                    const mergeTribes = availableTribes.filter(t => isMergeName(t));
                                    const unassignedTribes = availableTribes.filter(t => t === 'Unassigned');

                                    const renderTribeCard = (tribeName, isMerge = false) => {
                                        const style = (window.getTribeStyle ? window.getTribeStyle(tribeName, customTribesList) : null) || {};
                                        const assignedPlayerIds = Object.keys(bulkAssignments).filter(id => bulkAssignments[id] === tribeName);
                                        const assignedPlayersList = activePlayersForEp.filter(p => assignedPlayerIds.includes(String(p.id)) || assignedPlayerIds.includes(p.id));

                                        return h('div', {
                                            key: tribeName,
                                            onDragOver: (e) => e.preventDefault(),
                                            onDrop: (e) => {
                                                e.preventDefault();
                                                if (draggedPlayerId) {
                                                    setBulkAssignments(prev => ({ ...prev, [draggedPlayerId]: tribeName }));
                                                    setDraggedPlayerId(null);
                                                }
                                            },
                                            className: `rounded-2xl p-4 border-2 ${style.borderColor || 'border-slate-700'} ${style.cardBg || 'bg-slate-900'} transition-all duration-200 flex flex-col justify-between shadow-lg`
                                        },
                                        h('div', {},
                                            // Tribe Shape Header
                                            h('div', { className: `p-2.5 rounded-xl bg-gradient-to-r ${style.gradient || 'from-slate-700 to-slate-800'} text-white flex justify-between items-center mb-3 shadow-md` },
                                                h('div', { className: 'flex items-center gap-2 font-black text-sm tracking-wider uppercase' },
                                                    h('span', { className: `w-3 h-3 rounded-full inline-block shrink-0 border border-white/40 shadow-xs ${style.dotBg || 'bg-slate-400'}` }),
                                                    h('span', {}, tribeName)
                                                ),
                                                h('div', { className: 'flex items-center gap-1.5' },
                                                    (!isMerge && tribeName !== 'Unassigned' && !isMergeName(tribeName)) && h('button', {
                                                        type: 'button',
                                                        onClick: (e) => {
                                                            e.stopPropagation();
                                                            handleOpenEditTribe(tribeName);
                                                        },
                                                        className: 'px-2 py-0.5 rounded-lg bg-black/35 hover:bg-black/60 text-[10px] font-bold text-white border border-white/20 transition cursor-pointer flex items-center gap-1 shadow-xs'
                                                    }, 'Edit Tribe'),
                                                    h('span', { className: 'text-xs font-extrabold bg-white/20 backdrop-blur-sm px-2 py-0.5 rounded-full' }, `${assignedPlayersList.length} player(s)`)
                                                )
                                            ),

                                            // Player Name Buttons Box
                                            h('div', { className: `flex flex-wrap gap-2 ${isMerge ? 'min-h-[90px]' : 'min-h-[80px]'} p-2 bg-slate-950/40 rounded-xl border border-slate-800/80 items-start` },
                                                assignedPlayersList.length === 0 ?
                                                    h('div', { className: 'w-full text-center text-xs text-slate-500 italic py-4' }, 'Drag players here') :
                                                    assignedPlayersList.map(p => 
                                                        h('div', {
                                                            key: p.id,
                                                            draggable: true,
                                                            onDragStart: () => setDraggedPlayerId(p.id),
                                                            className: 'px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-xl font-bold text-xs border border-amber-500/40 cursor-grab active:cursor-grabbing shadow-sm flex items-center gap-1.5 transition transform hover:scale-105'
                                                        },
                                                            h('img', { src: p.image, className: 'w-5 h-5 rounded-full object-cover border border-white' }),
                                                            h('span', {}, p.name)
                                                        )
                                                    )
                                            )
                                        ));
                                    };

                                    return h('div', { className: 'max-h-[55vh] overflow-y-auto pr-1 space-y-4' },
                                        // 1. Competing Tribes (Original tribes + new custom tribes side by side)
                                        h('div', {},
                                            h('div', { className: 'flex items-center justify-between mb-2 px-1' },
                                                h('span', { className: 'text-xs font-black uppercase tracking-wider text-amber-400 flex items-center gap-1.5' },
                                                    h('span', {}, '🏕️'),
                                                    'Active Tribes'
                                                ),
                                                h('span', { className: 'text-[11px] text-slate-400 font-semibold' }, `${competingTribes.length} Tribe(s)`)
                                            ),
                                            h('div', { className: 'grid md:grid-cols-2 lg:grid-cols-3 gap-4' },
                                                competingTribes.map(tribeName => renderTribeCard(tribeName, false))
                                            )
                                        ),

                                        // 2. Merge Section Arranged at the Bottom
                                        h('div', { className: 'pt-3 border-t border-slate-800/80' },
                                            h('div', { className: 'flex items-center justify-between mb-2 px-1' },
                                                h('span', { className: 'text-xs font-black uppercase tracking-wider text-purple-400 flex items-center gap-1.5' },
                                                    h('span', {}, '🤝'),
                                                    'Merge & Consolidated Tribe'
                                                ),
                                                h('span', { className: 'text-[11px] text-slate-400 font-semibold' }, 'Arranged at bottom for post-merge assignments')
                                            ),
                                            h('div', { className: `grid gap-4 ${unassignedTribes.length > 0 ? 'md:grid-cols-2' : 'grid-cols-1'}` },
                                                mergeTribes.map(tribeName => 
                                                    h('div', { key: tribeName },
                                                        renderTribeCard(tribeName, true)
                                                    )
                                                ),
                                                unassignedTribes.map(tribeName =>
                                                    h('div', { key: tribeName },
                                                        renderTribeCard(tribeName, true)
                                                    )
                                                )
                                            )
                                        )
                                    );
                                })()
                            ),

                            // Modal Footer Controls
                            h('div', { className: 'flex justify-between items-center pt-4 border-t border-slate-800 mt-4 flex-wrap gap-2' },
                                h('div', { className: 'text-xs text-slate-400 font-medium' }, 'Changes will be saved to season configuration across all leagues.'),
                                h('div', { className: 'flex gap-2' },
                                    h('button', {
                                        id: 'btn-bulk-cancel',
                                        onClick: () => setShowBulkEditModal(false),
                                        className: 'px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition cursor-pointer'
                                    }, 'Cancel'),
                                    h('button', {
                                        id: 'btn-bulk-save-changes',
                                        onClick: handleSaveBulkEdit,
                                        className: 'px-6 py-2.5 bg-gradient-to-r from-orange-500 to-amber-600 text-white font-bold rounded-xl text-sm shadow-lg hover:shadow-xl transition cursor-pointer'
                                    }, 'Save Changes')
                                )
                            )
                        )
                    ),

                    // Confirm Merge Modal
                    showConfirmMergeModal && h('div', { id: 'modal-confirm-merge', className: 'fixed inset-0 bg-black/90 backdrop-blur-md z-[1300] flex items-center justify-center p-4' },
                        h('div', { className: 'bg-slate-900 rounded-3xl max-w-lg w-full p-6 text-white shadow-2xl border-2 border-purple-500/60 relative' },
                            h('div', { className: 'flex items-center gap-3 mb-4 pb-3 border-b border-slate-800' },
                                h('span', { className: 'text-3xl' }, '🤝'),
                                h('div', {},
                                    h('h3', { className: 'text-2xl font-black text-amber-400', style: { fontFamily: '"Bebas Neue", cursive' } }, `CONFIRM MERGE (EPISODE ${bulkEditEpisode})`),
                                    h('p', { className: 'text-xs text-slate-400 font-semibold' }, 'Shift all active players to Merge Tribe & award Merge points.')
                                )
                            ),

                            h('div', { className: 'bg-purple-950/80 text-purple-200 border border-purple-500/40 p-3 rounded-xl text-xs font-semibold mb-4 space-y-1' },
                                h('div', { className: 'font-bold text-amber-300' }, '🏆 Automated Merge Actions:'),
                                h('div', {}, `• Reassigns all active non-eliminated players to "Merge Tribe" starting Episode ${bulkEditEpisode}.`),
                                h('div', {}, `• Awards +10 Merge Points ("Makes It to the Merge") idempotently in score logs for all active leagues.`)
                            ),

                            h('div', { className: 'mb-4' },
                                h('label', { className: 'block text-xs font-bold text-slate-300 uppercase mb-2' }, 'Contestants Scheduled for Merge:'),
                                h('div', { className: 'flex flex-wrap gap-2 max-h-40 overflow-y-auto p-2 bg-slate-950/80 rounded-xl border border-slate-800' },
                                    players.filter(p => {
                                        const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                                        return !elimEp || parseInt(elimEp) >= parseInt(bulkEditEpisode);
                                    }).map(p =>
                                        h('div', { key: p.id, className: 'px-2.5 py-1 bg-purple-900/60 border border-purple-400/30 rounded-lg text-xs font-bold text-purple-200 flex items-center gap-1.5' },
                                            h('img', { src: p.image, className: 'w-4 h-4 rounded-full object-cover' }),
                                            h('span', {}, p.name)
                                        )
                                    )
                                )
                            ),

                            h('div', { className: 'flex gap-2' },
                                h('button', {
                                    onClick: () => setShowConfirmMergeModal(false),
                                    className: 'w-1/2 px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-sm hover:bg-slate-700'
                                }, 'Cancel'),
                                h('button', {
                                    onClick: handleConfirmMergeAll,
                                    className: 'w-1/2 px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-500 hover:to-indigo-600 text-white font-bold rounded-xl text-sm shadow-lg'
                                }, 'Execute Merge 🤝')
                            )
                        )
                    )
                )
            );
        }
        
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return h('div', { className: 'p-6 bg-red-900 text-white rounded-2xl m-4 max-w-4xl mx-auto shadow-2xl border border-red-500 my-12' },
                        h('h2', { className: 'text-2xl font-bold mb-2 flex items-center gap-2' }, '⚠️ Scoring Page Render Error'),
                        h('p', { className: 'text-sm font-mono bg-black/50 p-4 rounded-xl text-red-200 overflow-x-auto mb-4' }, String(this.state.error && this.state.error.stack ? this.state.error.stack : this.state.error)),
                        h('button', {
                            className: 'px-5 py-2.5 bg-white text-red-950 font-black rounded-xl hover:bg-red-100 transition shadow-md cursor-pointer',
                            onClick: () => this.setState({ hasError: false, error: null })
                        }, '🔄 Try Again / Reset')
                    );
                }
                return this.props.children;
            }
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(ErrorBoundary, null, h(ScoringPage)));
    }
    </script>
    
    <!-- PWA Service Worker -->
    <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js?v=10')
            .then((registration) => {
                console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
                console.error('Service Worker registration failed:', error);
            });
    }

    // Detect if running as installed PWA
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running as installed PWA');
    }
    </script>
</body>
</html>
