    <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errorDetails = (error && error.stack) ? error.stack : (msg + ' at ' + url + ':' + lineNo + ':' + columnNo);
        console.error('GLOBAL RUNTIME ERROR:', errorDetails);
        var div = document.createElement('div');
        div.id = 'global-error-banner';
        div.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;z-index:999999;background:#991b1b;color:#fef2f2;padding:20px;border-radius:12px;font-family:monospace;font-size:13px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);border:2px solid #ef4444;';
        div.innerHTML = '<strong style="font-size:16px;">🚨 FATAL RUNTIME ERROR:</strong><br><pre style="white-space:pre-wrap;margin-top:10px;max-height:300px;overflow-y:auto;background:rgba(0,0,0,0.4);padding:10px;border-radius:8px;">' + errorDetails + '</pre>';
        if (document.body) document.body.appendChild(div);
        return false;
    };
    </script>

        // Helper: Resolve backfill episode for a player
        function getBackfillEpisode(playerId, dState) {
            if (!dState || !dState.backfilledPlayers) return null;
            const bf = dState.backfilledPlayers[playerId] || dState.backfilledPlayers[String(playerId)] || dState.backfilledPlayers[Number(playerId)];
            if (!bf) return null;
            if (typeof bf === 'number') return bf;
            if (typeof bf === 'object' && bf !== null && bf.episode !== undefined) return parseInt(bf.episode);
            return 1; // Default fallback for legacy boolean true
        }

        function TorchLit({ size = 34 }) {

        function TeamEventStackedBarChart({ roster, scores, draftState, eliminationOrder }) {
            const { useState, useMemo } = React;
            const [selectedEp, setSelectedEp] = useState(1);
            const [hoveredEvent, setHoveredEvent] = useState(null);

            const eventColors = {
                'Individual Immunity Win': '#10b981',
                'Tribe Immunity Win': '#34d399',
                'Individual Reward Win': '#059669',
                'Tribe Reward Win': '#6ee7b7',
                'Finds Idol': '#f59e0b',
                'Finds Advantage': '#fbbf24',
                'Uses Idol Correctly': '#d97706',
                'Survived Tribal Council': '#3b82f6',
                'Confessional': '#8b5cf6',
                'Elimination Bonus': '#ec4899',
                'Sole Survivor Winner Bonus': '#eab308',
                'Negative Event': '#ef4444',
                'Other Event': '#64748b'
            };

            const { maxEp, epDataMap } = useMemo(() => {
                let highestEp = 1;
                const map = {};

                roster.forEach(player => {
                    const pScores = (scores || {})[player.id] || (scores || {})[String(player.id)] || {};
                    const bfEp = getBackfillEpisode(player.id, draftState);
                    
                    Object.entries(pScores).forEach(([epStr, epData]) => {
                        const ep = parseInt(epStr);
                        if (!isNaN(ep)) {
                            if (ep > highestEp) highestEp = ep;
                            if (bfEp === null || ep > bfEp) {
                                if (!map[ep]) map[ep] = {};
                                if (!map[ep][player.id]) map[ep][player.id] = { player, totalPts: 0, posPts: 0, negPts: 0, events: [] };
                                
                                Object.values(epData || {}).forEach(score => {
                                    const pts = (score.points || 0);
                                    if (pts !== 0) {
                                        const eventName = score.category || (pts < 0 ? 'Negative Penalty' : 'Points Event');
                                        let matchedCol = pts < 0 ? eventColors['Negative Event'] : eventColors['Other Event'];
                                        
                                        if (eventName.includes('Individual Immunity')) matchedCol = eventColors['Individual Immunity Win'];
                                        else if (eventName.includes('Tribe Immunity')) matchedCol = eventColors['Tribe Immunity Win'];
                                        else if (eventName.includes('Reward')) matchedCol = eventColors['Individual Reward Win'];
                                        else if (eventName.includes('Idol') && pts > 0) matchedCol = eventColors['Finds Idol'];
                                        else if (eventName.includes('Advantage')) matchedCol = eventColors['Finds Advantage'];
                                        else if (eventName.includes('Tribal') || eventName.includes('Survived')) matchedCol = eventColors['Survived Tribal Council'];
                                        else if (eventName.includes('Confessional')) matchedCol = eventColors['Confessional'];
                                        else if (eventName.includes('Winner') || eventName.includes('Sole')) matchedCol = eventColors['Sole Survivor Winner Bonus'];

                                        map[ep][player.id].totalPts += pts;
                                        if (pts > 0) map[ep][player.id].posPts += pts;
                                        else map[ep][player.id].negPts += Math.abs(pts);

                                        map[ep][player.id].events.push({
                                            name: eventName,
                                            pts: pts,
                                            col: matchedCol,
                                            note: score.note || ''
                                        });
                                    }
                                });
                            }
                        }
                    });

                    const elimEp = eliminationOrder && (eliminationOrder[player.id] || eliminationOrder[String(player.id)]);
                    if (elimEp) {
                        const ep = parseInt(elimEp);
                        if (!isNaN(ep)) {
                            if (ep > highestEp) highestEp = ep;
                            if (bfEp === null || ep > bfEp) {
                                if (!map[ep]) map[ep] = {};
                                if (!map[ep][player.id]) map[ep][player.id] = { player, totalPts: 0, posPts: 0, negPts: 0, events: [] };
                                map[ep][player.id].totalPts += ep;
                                map[ep][player.id].posPts += ep;
                                map[ep][player.id].events.push({
                                    name: `Eliminated Placement Bonus (+${ep} pts)`,
                                    pts: ep,
                                    col: eventColors['Elimination Bonus'],
                                    note: `Placed Episode ${ep}`
                                });
                            }
                        }
                    }
                });

                return { maxEp: highestEp, epDataMap: map };
            }, [roster, scores, draftState, eliminationOrder]);

            const episodes = Array.from({ length: maxEp }, (_, i) => i + 1);
            const activeEpMap = epDataMap[selectedEp] || {};
            const selectedEpTotal = roster.reduce((sum, p) => sum + (activeEpMap[p.id] ? activeEpMap[p.id].totalPts : 0), 0);
            const maxValInEp = Math.max(15, ...roster.flatMap(p => {
                const d = activeEpMap[p.id];
                return d ? [d.posPts, d.negPts] : [0];
            }));

            return h('div', { className: 'bg-slate-900/90 border border-amber-500/30 rounded-xl p-4 mb-4 relative text-slate-100 backdrop-blur-md shadow-xl' },

                        h('span', { className: 'text-xs text-amber-200/70 font-medium' }, `Team Total: ${selectedEpTotal >= 0 ? `+${selectedEpTotal}` : selectedEpTotal} pts`)
                    ),

                    h('div', { className: 'flex items-center gap-2' },
                        selectedEp > 1 && h('button', {
                            onClick: () => setSelectedEp(prev => Math.max(1, prev - 1)),
                            className: 'px-2.5 py-1 bg-slate-800 border border-amber-900/60 rounded-lg text-xs font-bold text-amber-200 hover:bg-slate-700 cursor-pointer shadow-2xs'
                        }, '◄ Prev Ep'),

                        h('div', { className: 'px-3.5 py-1 bg-gradient-to-r from-amber-600 to-orange-600 text-white rounded-lg text-xs font-black shadow-xs' }, `Episode ${selectedEp}`),

                        selectedEp < maxEp && h('button', {
                            onClick: () => setSelectedEp(prev => Math.min(maxEp, prev + 1)),
                            className: 'px-2.5 py-1 bg-slate-800 border border-amber-900/60 rounded-lg text-xs font-bold text-amber-200 hover:bg-slate-700 cursor-pointer shadow-2xs'
                        }, 'Next Ep ►')
                    )
                ),

                // Interactive Single Episode Player Bar Chart (Aligned X-Axis Padding matching TeamScoreGraph)
                h('div', { className: 'flex items-center justify-around gap-4 pt-4 pb-2 min-h-[220px] relative px-[60px]' },
                    roster.length === 0 ? h('div', { className: 'text-center text-slate-400 italic' }, 'No players on roster') :
                    roster.map(player => {
                        const pData = activeEpMap[player.id] || { totalPts: 0, posPts: 0, negPts: 0, events: [] };
                        const netPts = pData.totalPts;
                        const posEvents = pData.events.filter(e => e.pts > 0);
                        const negEvents = pData.events.filter(e => e.pts < 0);

                        const posPct = (pData.posPts / maxValInEp) * 80;
                        const negPct = (pData.negPts / maxValInEp) * 80;

                        return h('div', { key: player.id, className: 'flex-1 flex flex-col items-center justify-center h-full max-w-[100px]' },
                            // Net Pts Label
                            h('div', { className: `text-xs font-black mb-1.5 ${netPts > 0 ? 'text-emerald-400' : netPts < 0 ? 'text-red-400' : 'text-slate-400'}` }, `${netPts > 0 ? `+${netPts}` : netPts} pts`),

                            // Dual Bar Stack Container (Positive above, Negative below)
                            h('div', { className: 'w-full max-w-[48px] flex flex-col items-center justify-center relative' },
                                // Positive Stack (grows upward)
                                h('div', { className: 'w-full bg-slate-800/60 rounded-t-lg overflow-hidden flex flex-col-reverse shadow-xs border border-amber-900/40 min-h-[4px]', style: { height: `${Math.max(4, posPct)}px` } },
                                    posEvents.map((ev, evIdx) => {
                                        const segPct = (ev.pts / (pData.posPts || 1)) * 100;
                                        return h('div', {
                                            key: evIdx,
                                            style: { height: `${segPct}%`, backgroundColor: ev.col },
                                            className: 'w-full transition-all hover:brightness-125 cursor-pointer border-b border-white/20',
                                            onMouseEnter: () => setHoveredEvent({ player: player.name, episode: selectedEp, event: ev }),
                                            onMouseLeave: () => setHoveredEvent(null),
                                            onClick: () => setHoveredEvent({ player: player.name, episode: selectedEp, event: ev })
                                        });
                                    })
                                ),

                                // Zero Baseline Divider
                                h('div', { className: 'w-full h-[2px] bg-amber-500/60 z-10 shadow-xs' }),

                                // Negative Stack (grows downward)
                                pData.negPts > 0 && h('div', { className: 'w-full bg-red-950/40 rounded-b-lg overflow-hidden flex flex-col shadow-xs border border-red-900/60 min-h-[4px]', style: { height: `${Math.max(4, negPct)}px` } },
                                    negEvents.map((ev, evIdx) => {
                                        const segPct = (Math.abs(ev.pts) / (pData.negPts || 1)) * 100;
                                        return h('div', {
                                            key: evIdx,
                                            style: { height: `${segPct}%`, backgroundColor: ev.col },
                                            className: 'w-full transition-all hover:brightness-125 cursor-pointer border-t border-white/20',
                                            onMouseEnter: () => setHoveredEvent({ player: player.name, episode: selectedEp, event: ev }),
                                            onMouseLeave: () => setHoveredEvent(null),
                                            onClick: () => setHoveredEvent({ player: player.name, episode: selectedEp, event: ev })
                                        });
                                    })
                                )
                            ),

                            h('span', { className: 'text-xs font-extrabold text-slate-300 mt-2 text-center truncate max-w-[80px]' }, player.name.split(' ')[0])
                        );
                    })
                ),

                // Interactive Event Detail Tooltip / Card on Hover or Click
                hoveredEvent ? h('div', { className: 'mt-3 p-2.5 bg-slate-950 text-white rounded-xl text-xs flex items-center justify-between shadow-2xl border border-amber-500/40 animate-fadeIn' },
                    h('div', { className: 'flex items-center gap-2' },
                        h('span', { className: 'w-3 h-3 rounded-full shrink-0 shadow-xs', style: { backgroundColor: hoveredEvent.event.col } }),
                        h('span', { className: 'font-bold text-amber-400' }, `${hoveredEvent.player} (Ep ${hoveredEvent.episode}):`),
                        h('span', { className: 'font-semibold text-slate-200' }, hoveredEvent.event.name),
                        hoveredEvent.event.note && h('span', { className: 'text-slate-400 italic text-[11px]' }, `(${hoveredEvent.event.note})`)
                    ),
                    h('span', { className: `font-black px-2 py-0.5 rounded border ml-2 ${hoveredEvent.event.pts < 0 ? 'text-red-400 bg-red-950/80 border-red-500/40' : 'text-emerald-400 bg-emerald-950/80 border-emerald-500/40'}` }, `${hoveredEvent.event.pts > 0 ? '+' : ''}${hoveredEvent.event.pts} pts`)
                ) : h('div', { className: 'mt-3 p-2 bg-slate-950/60 text-amber-200/70 rounded-xl text-[11px] text-center font-medium border border-dashed border-amber-900/50' },
                    '💡 Hover or click over any stacked bar section above to see exact positive or negative scoring event details'
                )
            );
        }

        function TeamRosterDonutChart({ roster, getPlayerScore }) {
            const { useMemo } = React;
            const playerColors = ['#f97316', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6', '#f59e0b', '#06b6d4'];
            
            const data = useMemo(() => {
                let total = 0;
                const items = roster.map((p, idx) => {
                    const score = Math.max(0, getPlayerScore(p.id));
                    total += score;
                    return {
                        id: p.id,
                        name: p.name,
                        score: score,
                        color: playerColors[idx % playerColors.length]
                    };
                });
                return { total, items };
            }, [roster, getPlayerScore]);

            if (data.total === 0) return null;

            let accumulatedAngle = 0;
            const size = 120;
            const radius = 45;
            const strokeWidth = 14;
            const center = size / 2;
            const circumference = 2 * Math.PI * radius;

            return h('div', { className: 'bg-slate-900/90 border border-amber-500/30 rounded-xl p-3.5 mb-4 flex items-center justify-between flex-wrap gap-4 backdrop-blur-md shadow-lg' },
                h('div', { className: 'flex items-center gap-4 flex-wrap' },
                    h('div', { className: 'relative w-28 h-28 shrink-0 flex items-center justify-center' },
                        h('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}`, className: 'transform -rotate-90' },
                            data.items.map(item => {
                                if (item.score <= 0) return null;
                                const strokeDasharray = `${(item.score / data.total) * circumference} ${circumference}`;
                                const strokeDashoffset = -accumulatedAngle;
                                accumulatedAngle += (item.score / data.total) * circumference;

                                return h('circle', {
                                    key: item.id,
                                    cx: center,
                                    cy: center,
                                    r: radius,
                                    fill: 'transparent',
                                    stroke: item.color,
                                    strokeWidth: strokeWidth,
                                    strokeDasharray: strokeDasharray,
                                    strokeDashoffset: strokeDashoffset,
                                    className: 'transition-all duration-300 hover:opacity-80'
                                });
                            })
                        ),
                        h('div', { className: 'absolute inset-0 flex flex-col items-center justify-center text-center' },
                            h('span', { className: 'text-[10px] text-amber-300/80 font-bold uppercase tracking-xs' }, 'Total'),
                            h('span', { className: 'text-lg font-black text-amber-100 leading-none' }, data.total)

                    ),
                    h('div', {},

                        h('div', { className: 'space-y-1.5' },
                            data.items.map(item => {
                                const pct = Math.round((item.score / data.total) * 100) || 0;
                                return h('div', { key: item.id, className: 'flex items-center gap-2 text-xs font-semibold' },
                                    h('span', { className: 'w-2.5 h-2.5 rounded-full shrink-0 shadow-xs', style: { backgroundColor: item.color } }),
                                    h('span', { className: 'text-slate-200 font-bold' }, item.name),

                                );
                            })
                        )
                    )
                )
            );

        function TeamScoreGraph({ leaderboard, scores, eliminationOrder, winner, playerTeams, players, draftState }) {
            const { useState, useMemo } = React;
            const [chartMode, setChartMode] = useState('cumulative');
            const [hoveredPoint, setHoveredPoint] = useState(null);
            const [hoveredTeamId, setHoveredTeamId] = useState(null);

            const maxEpisode = useMemo(() => {
                let maxEp = 1;
                Object.values(scores || {}).forEach(playerScores => {
                    Object.keys(playerScores || {}).forEach(ep => {
                        const num = parseInt(ep);
                        if (!isNaN(num) && num > maxEp) maxEp = num;
                    });
                });
                return Math.max(maxEp, 1);
            }, [scores]);

            const episodes = useMemo(() => {
                const arr = [];
                for (let i = 1; i <= maxEpisode; i++) arr.push(i);
                return arr;
            }, [maxEpisode]);

            const teamColors = [
                { stroke: '#f97316', bg: 'bg-orange-500', hex: '#f97316' },
                { stroke: '#6366f1', bg: 'bg-indigo-500', hex: '#6366f1' },
                { stroke: '#10b981', bg: 'bg-emerald-500', hex: '#10b981' },
                { stroke: '#ec4899', bg: 'bg-pink-500', hex: '#ec4899' },
                { stroke: '#8b5cf6', bg: 'bg-purple-500', hex: '#8b5cf6' },
                { stroke: '#3b82f6', bg: 'bg-blue-500', hex: '#3b82f6' },
                { stroke: '#f59e0b', bg: 'bg-amber-500', hex: '#f59e0b' }
            ];

            const { series, minScoreVal, maxScoreVal } = useMemo(() => {
                let minVal = 0;
                let maxVal = 30;

                const teamSeries = leaderboard.map((team, index) => {
                    const teamStyle = teamColors[index % teamColors.length];
                    const roster = players.filter(p => playerTeams[p.id] === team.id);
                    
                    let cumulative = 0;
                    const playerCumMap = {};
                    roster.forEach(p => { playerCumMap[p.id] = 0; });

                    const history = episodes.map(ep => {
                        let epGain = 0;

                        roster.forEach(player => {
                            let pEpPts = 0;
                            const bfEp = getBackfillEpisode(player.id, draftState);
                            if (bfEp === null || ep > bfEp) {
                                const playerScores = (scores[player.id] || {})[ep] || {};
                                Object.values(playerScores).forEach(score => {
                                    const pts = (score.points || 0);
                                    cumulative += pts;
                                    epGain += pts;
                                    pEpPts += pts;
                                });
                                if (eliminationOrder && (eliminationOrder[player.id] === ep || eliminationOrder[String(player.id)] === ep)) {
                                    cumulative += ep;
                                    epGain += ep;
                                    pEpPts += ep;
                                }
                            }
                            playerCumMap[player.id] = (playerCumMap[player.id] || 0) + pEpPts;
                        });

                        if (winner && ep >= 14 && roster.some(p => p.id === parseInt(winner))) {
                            if (ep === 14) {
                                cumulative += 20;
                                epGain += 20;
                            }
                        }

                        const playerBreakdown = roster.map(p => ({
                            name: p.name,
                            pts: playerCumMap[p.id] || 0
                        }));

                        if (cumulative > maxVal) maxVal = cumulative;
                        if (cumulative < minVal) minVal = cumulative;

                        return { episode: ep, score: cumulative, epGain, playerBreakdown };
                    });

                    return {
                        id: team.id,
                        name: team.name,
                        style: teamStyle,
                        currentScore: team.score,
                        roster: roster,
                        history: history
                    };
                });

                return { series: teamSeries, minScoreVal: minVal, maxScoreVal: maxVal };
            }, [leaderboard, scores, episodes, eliminationOrder, winner, playerTeams, players, draftState]);

            const width = 800;
            const height = 300;
            const paddingLeft = 60;
            const paddingRight = 40;
            const paddingTop = 38;
            const paddingBottom = 45;
            const plotWidth = width - paddingLeft - paddingRight;
            const plotHeight = height - paddingTop - paddingBottom;

            const minY = Math.floor((minScoreVal - 5) / 10) * 10;
            const maxY = Math.max(30, Math.ceil((maxScoreVal + 10) / 20) * 20);
            const domainY = maxY - minY || 1;

            const barOffsetMargin = 28;
            const getX = (epIndex, isBarChart = false) => {
                if (episodes.length <= 1) return paddingLeft + plotWidth / 2;
                if (isBarChart) {
                    const availableW = plotWidth - barOffsetMargin * 2;
                    return paddingLeft + barOffsetMargin + (epIndex / (episodes.length - 1)) * availableW;
                }
                return paddingLeft + (epIndex / (episodes.length - 1)) * plotWidth;
            };

            const getY = (val) => paddingTop + plotHeight - ((val - minY) / domainY) * plotHeight;

            const renderChartContent = () => {
                if (chartMode === 'cumulative') {
                    const ySteps = 5;
                    const stepVal = domainY / (ySteps - 1);
                    const gridSteps = Array.from({ length: ySteps }, (_, i) => Math.round(minY + i * stepVal));

                    return h('g', {},
                        gridSteps.map((val, idx) => {
                            const yPos = getY(val);
                            return h('g', { key: idx },
                                h('line', { x1: paddingLeft, y1: yPos, x2: width - paddingRight, y2: yPos, stroke: '#334155', strokeWidth: 1 }),
                                h('text', { x: paddingLeft - 10, y: yPos + 4, textAnchor: 'end', fontSize: 11, fontWeight: 'bold', fill: val < 0 ? '#f87171' : '#94a3b8' }, `${val}p`)
                            );
                        }),
                        minY < 0 && h('line', { x1: paddingLeft, y1: getY(0), x2: width - paddingRight, y2: getY(0), stroke: '#f59e0b', strokeWidth: 2, strokeDasharray: '4 4' }),
                        series.map(s => {
                            const isDimmed = hoveredTeamId && hoveredTeamId !== s.id;
                            const pointsStr = s.history.map((h, i) => `${getX(i)},${getY(h.score)}`).join(' ');

                            return h('g', { key: s.id, style: { opacity: isDimmed ? 0.2 : 1, transition: 'opacity 0.2s' } },
                                h('polyline', { fill: 'none', stroke: s.style.stroke, strokeWidth: hoveredTeamId === s.id ? 5 : 3.5, strokeLinecap: 'round', strokeLinejoin: 'round', points: pointsStr }),
                                s.history.map((pt, i) => {
                                    const cx = getX(i);
                                    const cy = getY(pt.score);
                                    const isHov = hoveredPoint && hoveredPoint.teamId === s.id && hoveredPoint.episode === pt.episode;
                                    return h('g', { key: i },
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: isHov ? 7 : 4.5,
                                            fill: '#ffffff',
                                            stroke: s.style.stroke,
                                            strokeWidth: 2.5
                                        }),
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: 12,
                                            fill: 'transparent',
                                            className: 'cursor-pointer',
                                            onMouseEnter: () => setHoveredPoint({ teamId: s.id, teamName: s.name, episode: pt.episode, score: pt.score, playerBreakdown: pt.playerBreakdown, cx, cy }),
                                            onMouseLeave: () => setHoveredPoint(null)
                                        })
                                    );
                                })
                            );
                        })
                    );
                }

                if (chartMode === 'weekly') {
                    const maxEpGain = Math.max(15, ...series.flatMap(s => s.history.map(h => h.epGain)));
                    const getBarY = (gain) => paddingTop + plotHeight - (Math.max(0, gain) / maxEpGain) * plotHeight;

                    return h('g', {},
                        [0, Math.round(maxEpGain * 0.5), maxEpGain].map((val, idx) => {
                            const yPos = getBarY(val);
                            return h('g', { key: idx },
                                h('line', { x1: paddingLeft, y1: yPos, x2: width - paddingRight, y2: yPos, stroke: '#334155', strokeWidth: 1 }),
                                h('text', { x: paddingLeft - 10, y: yPos + 4, textAnchor: 'end', fontSize: 11, fontWeight: 'bold', fill: '#94a3b8' }, `${val}p`)
                            );
                        }),
                        episodes.map((ep, epIdx) => {
                            const groupCenterX = getX(epIdx, true);
                            const totalSeries = series.length;
                            const barW = Math.min(14, (plotWidth / (episodes.length * totalSeries)) * 0.85);
                            const groupW = totalSeries * barW;
                            const startX = groupCenterX - groupW / 2;

                            return h('g', { key: ep },
                                series.map((s, sIdx) => {
                                    const pt = s.history[epIdx];
                                    const gain = pt ? pt.epGain : 0;
                                    const bx = startX + sIdx * barW;
                                    const by = getBarY(gain);
                                    const bh = Math.max(2, paddingTop + plotHeight - by);

                                    return h('rect', {
                                        key: s.id,
                                        x: bx,
                                        y: by,
                                        width: barW - 2,
                                        height: bh,
                                        fill: s.style.hex,
                                        rx: 3,
                                        className: 'transition-all hover:brightness-125 cursor-pointer',
                                        onMouseEnter: () => setHoveredPoint({ teamId: s.id, teamName: s.name, episode: ep, score: `${gain >= 0 ? `+${gain}` : gain} pts in Ep ${ep}`, cx: bx + barW/2, cy: by }),
                                        onMouseLeave: () => setHoveredPoint(null)
                                    });
                                })
                            );
                        })
                    );
                }

                if (chartMode === 'rank') {
                    const totalTeams = series.length;
                    const getRankY = (rankNum) => paddingTop + ((rankNum - 1) / Math.max(1, totalTeams - 1)) * plotHeight;

                    return h('g', {},
                        Array.from({ length: totalTeams }, (_, i) => i + 1).map(r => {
                            const yPos = getRankY(r);
                            return h('g', { key: r },
                                h('line', { x1: paddingLeft, y1: yPos, x2: width - paddingRight, y2: yPos, stroke: '#334155', strokeWidth: 1 }),
                                h('text', { x: paddingLeft - 10, y: yPos + 4, textAnchor: 'end', fontSize: 11, fontWeight: 'bold', fill: '#f97316' }, `Rank #${r}`)
                            );
                        }),
                        series.map(s => {
                            const isDimmed = hoveredTeamId && hoveredTeamId !== s.id;
                            const rankHistory = episodes.map((ep, epIdx) => {
                                const epScores = series.map(ts => ({ id: ts.id, score: ts.history[epIdx].score }));
                                epScores.sort((a, b) => b.score - a.score);
                                const rIndex = epScores.findIndex(item => item.id === s.id);
                                return { episode: ep, rank: rIndex + 1 };
                            });

                            const pointsStr = rankHistory.map((rh, i) => `${getX(i)},${getRankY(rh.rank)}`).join(' ');
                            return h('g', { key: s.id, style: { opacity: isDimmed ? 0.15 : 1, transition: 'opacity 0.2s' } },
                                h('polyline', { fill: 'none', stroke: s.style.stroke, strokeWidth: hoveredTeamId === s.id ? 5 : 3.5, strokeLinecap: 'round', strokeLinejoin: 'round', points: pointsStr }),
                                rankHistory.map((rh, i) => {
                                    const cx = getX(i);
                                    const cy = getRankY(rh.rank);
                                    return h('g', { key: i },
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: 5,
                                            fill: '#ffffff',
                                            stroke: s.style.stroke,
                                            strokeWidth: 2.5
                                        }),
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: 12,
                                            fill: 'transparent',
                                            className: 'cursor-pointer',
                                            onMouseEnter: () => {
                                                setHoveredPoint({ teamId: s.id, teamName: s.name, episode: rh.episode, score: `Rank #${rh.rank} in Ep ${rh.episode}`, cx, cy });
                                            },
                                            onMouseLeave: () => {
                                                setHoveredPoint(null);
                                            }
                                        })
                                    );
                                })
                            );
                        })
                    );
                }

                if (chartMode === 'roi') {
                    const numTeams = series.length || 5;
                    const allDrafted = series.flatMap(s => s.roster.map((p, pIdx) => ({
                        teamName: s.name,
                        color: s.style.hex,
                        name: p.name,
                        overallPick: pIdx + 1,
                        score: Math.max(0, Math.round(Object.values(scores[p.id] || {}).flatMap(e => Object.values(e)).reduce((a, b) => a + (b.points || 0), 0)))
                    })));

                    allDrafted.sort((a, b) => a.overallPick - b.overallPick);

                    const maxPts = Math.max(30, ...allDrafted.map(d => d.score));
                    const barW = Math.min(26, (plotWidth / Math.max(1, allDrafted.length)) * 0.8);

                    return h('g', {},
                        allDrafted.map((item, i) => {
                            const roundNum = Math.floor(i / numTeams) + 1;
                            const pickInRound = (i % numTeams) + 1;
                            const pickFormatted = `${roundNum}.${pickInRound}`;

                            const bx = paddingLeft + (i / Math.max(1, allDrafted.length - 1)) * (plotWidth - barW);
                            const bh = (item.score / maxPts) * plotHeight;
                            const by = paddingTop + plotHeight - bh;

                            const renderDivider = i > 0 && i % numTeams === 0;
                            const prevBx = paddingLeft + ((i - 1) / Math.max(1, allDrafted.length - 1)) * (plotWidth - barW);
                            const divX = (prevBx + barW + bx) / 2;

                            return h('g', { key: i },
                                // Vertical Round Divider Line between Round N and Round N+1
                                renderDivider && h('g', { key: 'div-' + i },
                                    h('line', { x1: divX, y1: paddingTop - 16, x2: divX, y2: paddingTop + plotHeight + 4, stroke: '#f59e0b', strokeWidth: 1.5, strokeDasharray: '4 3', opacity: 0.6 }),
                                    h('text', { x: divX + 4, y: paddingTop - 18, fontSize: 9, fontWeight: '900', fill: '#fbbf24' }, `R${roundNum}`)
                                ),

                                // Pick Number [Round].[Pick] on top of bar
                                h('text', { x: bx + barW/2, y: Math.max(paddingTop - 6, by - 6), textAnchor: 'middle', fontSize: 10, fontWeight: '900', fill: '#f97316' }, pickFormatted),

                                h('rect', {
                                    x: bx,
                                    y: by,
                                    width: barW,
                                    height: bh,
                                    fill: item.color,
                                    rx: 3,
                                    className: 'hover:brightness-125 cursor-pointer transition-all',
                                    onMouseEnter: () => setHoveredPoint({ teamId: i, teamName: item.teamName, episode: item.name, score: `${item.name} (${item.teamName}): ${item.score} pts (Pick ${pickFormatted})`, cx: bx + barW/2, cy: by }),
                                    onMouseLeave: () => setHoveredPoint(null)
                                }),

                                // Castaway name in crisp bright off-white text below X-axis
                                h('text', { x: bx + barW/2, y: paddingTop + plotHeight + 16, textAnchor: 'middle', fontSize: 9, fontWeight: '800', fill: '#f8fafc' }, item.name.split(' ')[0])
                            );
                        })
                    );
                }
            };

            const getTooltipPositionStyle = () => {
                if (!hoveredPoint) return {};
                const leftPct = (hoveredPoint.cx / width) * 100;
                const topPct = (hoveredPoint.cy / height) * 100;
                
                const isNearTop = hoveredPoint.cy < 110;
                const isNearRight = hoveredPoint.cx > width * 0.72;
                const isNearLeft = hoveredPoint.cx < width * 0.28;

                let translateX = '-50%';
                if (isNearRight) translateX = '-88%';
                if (isNearLeft) translateX = '-10%';

                let translateY = isNearTop ? '15px' : 'calc(-100% - 14px)';

                return {
                    left: `${leftPct}%`,
                    top: `${topPct}%`,
                    transform: `translate(${translateX}, ${translateY})`
                };
            };

            return h('div', { className: 'bg-slate-900/90 backdrop-blur-md rounded-2xl p-6 mb-8 shadow-2xl border border-amber-500/30 text-slate-100' },
                h('div', { className: 'flex justify-between items-center mb-4 flex-wrap gap-3' },
                    h('div', {},
                        h('h2', { className: 'text-2xl font-black flex items-center gap-2 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-200 bg-clip-text text-transparent', style: { fontFamily: '"Bebas Neue", cursive' } }, 
                            '📊 LEAGUE ANALYTICS & VISUALIZATIONS'
                        ),
                        h('p', { className: 'text-xs text-amber-200/70 font-medium' }, 'Interactive performance insights, rank trajectory, and draft pick efficiency')
                    ),
                    
                    h('div', { className: 'flex bg-slate-950/80 p-1.5 rounded-xl gap-1.5 flex-wrap text-xs font-bold border border-amber-900/60 shadow-inner' },
                        [
                            { id: 'cumulative', label: '📈 Cumulative' },
                            { id: 'weekly', label: '📊 Weekly Gains' },
                            { id: 'rank', label: '🏆 Rank Trajectory' },
                            { id: 'roi', label: '💡 Draft ROI' }
                        ].map(t => h('button', {
                            key: t.id,
                            onClick: () => setChartMode(t.id),
                            className: `px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                chartMode === t.id ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white font-black shadow-md border border-amber-400/50 scale-105' : 'text-amber-200/70 hover:text-white hover:bg-slate-800/80'
                            }`
                        }, t.label))
                    )
                ),

                h('div', { className: 'flex items-center gap-2 flex-wrap text-xs font-bold mb-3' },
                    series.map(s => h('div', {
                        key: s.id,
                        onMouseEnter: () => setHoveredTeamId(s.id),
                        onMouseLeave: () => setHoveredTeamId(null),
                        className: `flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all cursor-pointer ${
                            hoveredTeamId === s.id ? 'bg-amber-950 border-amber-500/80 scale-105 shadow-xs text-amber-200' : 'bg-slate-800/80 border-amber-900/40 text-slate-300'
                        }`
                    },
                        h('span', { className: `w-3 h-3 rounded-full ${s.style.bg}` }),
                        h('span', {}, `${s.name}:`),
                        h('span', { className: 'font-extrabold text-amber-400' }, `${s.currentScore} pts`)
                    ))
                ),

                h('div', { className: 'relative w-full overflow-visible' },
                    h('svg', { 
                        viewBox: `0 0 ${width} ${height}`, 
                        className: 'w-full h-auto max-h-[320px] min-w-[500px] overflow-visible'
                    },
                        renderChartContent(),
                        
                        chartMode !== 'roi' && episodes.map((ep, idx) => {
                            const xPos = getX(idx, chartMode === 'weekly');
                            return h('text', {
                                key: ep,
                                x: xPos,
                                y: height - 12,
                                textAnchor: 'middle',
                                fontSize: 11,
                                fontWeight: 'bold',
                                fill: '#94a3b8'
                            }, `Ep ${ep}`);
                        })
                    ),

                    hoveredPoint && h('div', {
                        className: 'absolute z-30 bg-slate-900 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow-2xl border border-slate-700 pointer-events-none min-w-[160px]',
                        style: getTooltipPositionStyle()
                    },
                        h('div', { className: 'text-orange-400 font-black border-b border-slate-800 pb-1 mb-1.5 flex justify-between items-center gap-2' },
                            h('span', {}, hoveredPoint.teamName),
                            typeof hoveredPoint.score === 'number' && h('span', { className: 'text-slate-300 font-extrabold' }, `Ep ${hoveredPoint.episode}: ${hoveredPoint.score}p`)
                        ),
                        typeof hoveredPoint.score === 'string' && h('div', { className: 'text-slate-200 font-bold mb-1' }, hoveredPoint.score),
                        hoveredPoint.playerBreakdown && Array.isArray(hoveredPoint.playerBreakdown) && h('div', { className: 'space-y-1 pt-0.5' },
                            h('div', { className: 'text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5' }, 'Roster Cumulative:'),
                            hoveredPoint.playerBreakdown.map((p, pIdx) => h('div', { key: pIdx, className: 'flex justify-between items-center text-[11px] text-slate-300' },
                                h('span', { className: 'text-slate-400 font-semibold' }, p.name),
                                h('span', { className: `font-bold ${p.pts > 0 ? 'text-emerald-400' : p.pts < 0 ? 'text-red-400' : 'text-slate-500'}` }, `${p.pts} pts`)
                            ))
                        )
                    )
                )
            );
        }

        function EpisodesScoredTracker({ scores, eliminationOrder, scoredEpisodes = {}, onEpisodeClick, theme }) {
            const episodes = Array.from({ length: 14 }, (_, i) => i + 1);

            const episodeStates = episodes.map(ep => {
                // State 1: Completed / Voted Out or Explicitly Scored
                const hasVotedOut = Object.entries(eliminationOrder || {}).some(([playerId, elimEp]) => {
                    return parseInt(elimEp) === ep;
                });
                const isExplicitlyScored = Boolean(scoredEpisodes && (scoredEpisodes[ep] || scoredEpisodes[`episode-${ep}`]));

                if (hasVotedOut || isExplicitlyScored) {
                    return { ep, status: 'completed', label: 'Completed', icon: '✓' };
                }

                // State 2: Being Scored / In Progress
                let hasPoints = false;
                let pointsCount = 0;
                Object.values(scores || {}).forEach(playerScores => {
                    if (playerScores && playerScores[ep]) {
                        const numScores = Object.keys(playerScores[ep]).length;
                        if (numScores > 0) {
                            hasPoints = true;
                            pointsCount += numScores;
                        }
                    }
                });

                if (hasPoints) {
                    return { ep, status: 'in-progress', label: 'Being Scored', icon: '⚪', count: pointsCount };
                }

                // State 3: Unscored / Not Started
                return { ep, status: 'unscored', label: 'Unscored', icon: '✗' };
            });

            const isTribal = theme === 'tribal';

            return h('div', { className: 'bg-white/90 backdrop-blur-md rounded-xl px-4 py-3 mb-6 shadow-md border border-gray-100/80 flex flex-col md:flex-row items-start md:items-center justify-between gap-3' },
                h('div', { className: 'flex items-center gap-2.5 flex-shrink-0' },
                    h('span', { className: 'text-base' }, '📺'),
                    h('span', { className: 'text-xs font-black uppercase tracking-wider text-gray-800 font-mono' }, 'Episodes Scored:'),
                    h('div', { className: 'hidden sm:flex items-center gap-2 text-[10px] font-bold text-gray-500 border-l border-gray-200 pl-2.5' },
                        h('span', { className: 'flex items-center gap-1' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-emerald-500' }), 'Scored (✓)'),
                        h('span', { className: 'flex items-center gap-1' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-slate-400' }), 'In Progress (⚪)'),
                        h('span', { className: 'flex items-center gap-1' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-amber-700/40 border border-amber-900/40' }), 'Unscored (✗)')
                    )
                ),

                h('div', { className: 'flex flex-wrap items-center gap-1.5 w-full md:w-auto overflow-x-auto py-0.5' },
                    episodeStates.map(item => {
                        let badgeStyle = '';

                        if (item.status === 'completed') {
                            badgeStyle = isTribal 
                                ? 'bg-emerald-950/80 border-emerald-500/70 text-emerald-300 hover:bg-emerald-900 shadow-xs' 
                                : 'bg-green-100 border-green-500 text-green-900 hover:bg-green-200 shadow-xs';
                        } else if (item.status === 'in-progress') {
                            badgeStyle = isTribal 
                                ? 'bg-slate-800/90 border-slate-400/70 text-slate-200 hover:bg-slate-700 shadow-xs' 
                                : 'bg-gray-200 border-gray-400 text-gray-800 hover:bg-gray-300 shadow-xs';
                        } else {
                            badgeStyle = isTribal 
                                ? 'bg-amber-950/20 border-amber-900/40 text-amber-300/40 hover:bg-amber-900/30 hover:text-amber-200/80' 
                                : 'bg-gray-50 border-gray-300 text-gray-400 hover:bg-gray-100 hover:text-gray-600 shadow-xs';
                        }

                        return h('button', {
                            key: item.ep,
                            type: 'button',
                            onClick: () => onEpisodeClick(item.ep),
                            title: `Episode ${item.ep}: ${item.label} (Click to add points)`,
                            className: `px-2 py-1 rounded-lg border text-[11px] font-bold font-mono flex items-center gap-1 transition-all duration-150 cursor-pointer ${badgeStyle}`
                        },
                            h('span', {}, `E${item.ep}`),
                            h('span', { className: 'text-[10px] font-black' }, item.icon)
                        );
                    })
                )
            );
        }

        function InstallAppModal({ isOpen, onClose }) {
            const [copied, setCopied] = useState(false);

            if (!isOpen) return null;

            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

                { id: 'most-idols-found', name: 'Most idols/advantages found', points: 20, category: 'End of Season' },
                { id: 'sole-survivor', name: 'Sole Survivor', points: 75, category: 'End of Season' },
                { id: 'runner-up', name: 'Runner-ups', points: 25, category: 'End of Season' }
            ];
            
            const [playerTeams, setPlayerTeams] = useState({});
            const [seasonData, setSeasonData] = useState(null);
            const [scores, setScores] = useState({});
            const [eliminationOrder, setEliminationOrder] = useState({});
            const [scoredEpisodes, setScoredEpisodes] = useState({});
            const [winner, setWinner] = useState(null); // Single winner ID
            const [currentEpisode, setCurrentEpisode] = useState(1);
            const [lastSelectedEpisode, setLastSelectedEpisode] = useState(() => localStorage.getItem('survivor_last_selected_episode') || '1');
            const [showRules, setShowRules] = useState(false);
            const [showAddScore, setShowAddScore] = useState(false);
            const [showMarkElimination, setShowMarkElimination] = useState(false);
            const [showMarkWinner, setShowMarkWinner] = useState(false);
            const [showSideMenu, setShowSideMenu] = useState(false);
            const [showInstallModal, setShowInstallModal] = useState(false);
            const [expandedTeams, setExpandedTeams] = useState({});
            const [theme, setTheme] = useState(() => localStorage.getItem('survivor_theme') || 'tribal');

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('install') === 'true' || window.location.hash === '#install') {
                    setShowInstallModal(true);
