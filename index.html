    <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errorDetails = (error && error.stack) ? error.stack : (msg + ' at ' + url + ':' + lineNo + ':' + columnNo);
        console.error('GLOBAL RUNTIME ERROR:', errorDetails);
        var div = document.createElement('div');
        div.id = 'global-error-banner';
        div.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;z-index:999999;background:#991b1b;color:#fef2f2;padding:20px;border-radius:12px;font-family:monospace;font-size:13px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);border:2px solid #ef4444;';
        div.innerHTML = '<strong style="font-size:16px;">🚨 FATAL RUNTIME ERROR:</strong><br><pre style="white-space:pre-wrap;margin-top:10px;max-height:300px;overflow-y:auto;background:rgba(0,0,0,0.4);padding:10px;border-radius:8px;">' + errorDetails + '</pre>';
        if (document.body) document.body.appendChild(div);
        return false;
    };
    </script>

            0%, 100% { transform: scale(1) translateY(0); opacity: 0.95; }

        @keyframes smokeRise {
            0% { transform: translateY(0) scaleX(1); opacity: 0.6; }

            100% { transform: translateY(-8px) scaleX(1.6); opacity: 0; }

            animation: torchFlamePulse 1.2s infinite ease-in-out;
            transform-origin: bottom center;

            animation: smokeRise 2.2s infinite linear;
            transform-origin: bottom center;

        .parchment-text {
            font-family: 'Caveat', cursive;

        // Helper: Resolve backfill episode for a player

            if (typeof bf === 'number') return bf;
            if (typeof bf === 'object' && bf !== null && bf.episode !== undefined) return parseInt(bf.episode);
            return 1; // Default fallback for legacy boolean true
        }

        function ParchmentContestantTag({ player, isEliminated, isWinner, tribeName, getTribeBadgeColor, getTribeIcon }) {

            },

                    isWinner && h('span', { className: 'text-[10px] text-amber-900 font-extrabold ml-0.5' }, '👑')
                )
            );
        }

        function TeamEventStackedBarChart({ roster, scores, draftState, eliminationOrder, viewingEpisode }) {
            const { useState, useMemo, useRef, useEffect } = React;
            const initialEp = Math.max(1, viewingEpisode || 1);
            const [selectedEp, setSelectedEp] = useState(initialEp);
            const [selectedPlayerId, setSelectedPlayerId] = useState(null);
            const [hoveredPlayerId, setHoveredPlayerId] = useState(null);

            useEffect(() => {
                if (viewingEpisode && viewingEpisode > 0) {
                    setSelectedEp(viewingEpisode);
                    setSelectedPlayerId(null);
                }
            }, [viewingEpisode]);

            const activePlayerId = selectedPlayerId !== null ? selectedPlayerId : hoveredPlayerId;

            // Touch debounce & scroll tracking
            const lastPlayerTouchTimeRef = useRef(0);
            const touchStartXRef = useRef(0);
            const touchStartYRef = useRef(0);
            const isTouchScrollRef = useRef(false);

            const handlePlayerToggle = (playerId, e) => {
                if (e) {
                    e.stopPropagation();
                    if (e.cancelable && e.type === 'touchstart') e.preventDefault();
                }
                setSelectedPlayerId(prev => {
                    if (prev === playerId) {
                        setHoveredPlayerId(null);
                        return null;
                    }
                    return playerId;
                });
            };

            const eventColors = {
                'Individual Immunity Win': '#10b981',
                'Tribe Immunity Win': '#34d399',
                'Individual Reward Win': '#059669',
                'Tribe Reward Win': '#6ee7b7',
                'Finds Idol': '#f59e0b',
                'Finds Advantage': '#fbbf24',
                'Uses Idol Correctly': '#d97706',
                'Survived Tribal Council': '#3b82f6',
                'Confessional': '#8b5cf6',
                'Elimination Bonus': '#ec4899',
                'Sole Survivor Winner Bonus': '#eab308',
                'Negative Event': '#ef4444',
                'Other Event': '#64748b'
            };

            const { maxEp, epDataMap, globalMaxPos, globalMaxNeg } = useMemo(() => {
                let highestEp = Math.max(1, viewingEpisode || 1);
                let maxPos = 15;
                let maxNeg = 15;
                const map = {};

                roster.forEach(player => {
                    const pScores = (scores || {})[player.id] || (scores || {})[String(player.id)] || {};
                    const bfEp = getBackfillEpisode(player.id, draftState);
                    
                    Object.entries(pScores).forEach(([epStr, epData]) => {
                        const ep = parseInt(epStr);
                        if (!isNaN(ep)) {
                            if (ep > highestEp) highestEp = ep;
                            if (bfEp === null || ep >= bfEp) {
                                if (!map[ep]) map[ep] = {};
                                if (!map[ep][player.id]) map[ep][player.id] = { player, totalPts: 0, posPts: 0, negPts: 0, events: [] };
                                
                                Object.values(epData || {}).forEach(score => {
                                    const pts = (score.points || 0);
                                    if (pts !== 0) {
                                        const eventName = score.category || (pts < 0 ? 'Negative Penalty' : 'Points Event');
                                        let matchedCol = pts < 0 ? eventColors['Negative Event'] : eventColors['Other Event'];
                                        
                                        if (eventName.includes('Individual Immunity')) matchedCol = eventColors['Individual Immunity Win'];
                                        else if (eventName.includes('Tribe Immunity')) matchedCol = eventColors['Tribe Immunity Win'];
                                        else if (eventName.includes('Reward')) matchedCol = eventColors['Individual Reward Win'];
                                        else if (eventName.includes('Idol') && pts > 0) matchedCol = eventColors['Finds Idol'];
                                        else if (eventName.includes('Advantage')) matchedCol = eventColors['Finds Advantage'];
                                        else if (eventName.includes('Tribal') || eventName.includes('Survived')) matchedCol = eventColors['Survived Tribal Council'];
                                        else if (eventName.includes('Confessional')) matchedCol = eventColors['Confessional'];
                                        else if (eventName.includes('Winner') || eventName.includes('Sole')) matchedCol = eventColors['Sole Survivor Winner Bonus'];

                                        map[ep][player.id].totalPts += pts;
                                        if (pts > 0) map[ep][player.id].posPts += pts;
                                        else map[ep][player.id].negPts += Math.abs(pts);

                                        map[ep][player.id].events.push({
                                            name: eventName,
                                            pts: pts,
                                            col: matchedCol,
                                            note: score.note || ''
                                        });
                                    }
                                });
                            }
                        }
                    });

                    const elimEp = eliminationOrder && (eliminationOrder[player.id] || eliminationOrder[String(player.id)]);
                    if (elimEp) {
                        const ep = parseInt(elimEp);
                        if (!isNaN(ep)) {
                            if (ep > highestEp) highestEp = ep;
                            if (bfEp === null || ep >= bfEp) {
                                if (!map[ep]) map[ep] = {};
                                if (!map[ep][player.id]) map[ep][player.id] = { player, totalPts: 0, posPts: 0, negPts: 0, events: [] };
                                map[ep][player.id].totalPts += ep;
                                map[ep][player.id].posPts += ep;
                                map[ep][player.id].events.push({
                                    name: `Eliminated Placement Bonus (+${ep} pts)`,
                                    pts: ep,
                                    col: eventColors['Elimination Bonus'],
                                    note: `Placed Episode ${ep}`
                                });
                            }
                        }
                    }
                });

                Object.values(map).forEach(epMap => {
                    Object.values(epMap).forEach(d => {
                        if (d.posPts > maxPos) maxPos = d.posPts;
                        if (d.negPts > maxNeg) maxNeg = d.negPts;
                    });
                });

                return { maxEp: highestEp, epDataMap: map, globalMaxPos: maxPos, globalMaxNeg: maxNeg };
            }, [roster, scores, draftState, eliminationOrder, viewingEpisode]);

            const episodes = Array.from({ length: maxEp }, (_, i) => i + 1);
            const activeEpMap = epDataMap[selectedEp] || {};
            const selectedEpTotal = roster.reduce((sum, p) => sum + (activeEpMap[p.id] ? activeEpMap[p.id].totalPts : 0), 0);

            // Active player resolution
            const activePlayer = activePlayerId ? roster.find(p => p.id === activePlayerId) : null;
            const activePlayerData = activePlayerId && activeEpMap[activePlayerId] ? activeEpMap[activePlayerId] : null;
            const activePlayerEvents = activePlayerData ? activePlayerData.events : [];
            const isPlayerLocked = selectedPlayerId !== null && selectedPlayerId === activePlayerId;

            // Compile all team events for this episode
            const allTeamEvents = useMemo(() => {
                const list = [];
                roster.forEach(p => {
                    const pData = activeEpMap[p.id];
                    if (pData && pData.events && pData.events.length > 0) {
                        pData.events.forEach(ev => {
                            list.push({
                                player: p,
                                event: ev
                            });
                        });
                    }
                });
                return list;
            }, [roster, activeEpMap]);

            return h('div', { className: 'bg-slate-900/90 border border-amber-500/30 rounded-xl p-4 mb-4 relative text-slate-100 backdrop-blur-md shadow-xl' },
                // Header Controls for Episode Navigation
                h('div', { className: 'flex justify-between items-center mb-3 flex-wrap gap-2 pb-1.5 w-full border-b border-amber-500/20' },
                    h('div', {},

                        h('span', { className: 'text-xs text-amber-200/70 font-medium' }, `Team Total: ${selectedEpTotal >= 0 ? `+${selectedEpTotal}` : selectedEpTotal} pts`)
                    ),

                    h('div', { className: 'flex items-center gap-1.5 ml-auto sm:ml-0' },
                        h('button', {
                            type: 'button',
                            onClick: () => {
                                setSelectedEp(prev => Math.max(1, prev - 1));
                                setSelectedPlayerId(null);
                            },
                            disabled: selectedEp <= 1,
                            title: 'Previous Episode',
                            className: `p-1 text-amber-400 hover:text-amber-200 cursor-pointer transition-transform hover:scale-125 select-none flex items-center justify-center ${selectedEp <= 1 ? 'opacity-0 pointer-events-none' : 'opacity-80 hover:opacity-100'}`
                        },
                            h('svg', { className: 'w-4 h-4 stroke-current fill-none stroke-[2.5]', viewBox: '0 0 24 24' },
                                h('path', { d: 'M15 18l-6-6 6-6', strokeLinecap: 'round', strokeLinejoin: 'round' })
                            )
                        ),

                        h('div', { className: 'text-sm font-black text-amber-300 min-w-[85px] text-center uppercase tracking-wider select-none' }, `Episode ${selectedEp}`),

                        h('button', {
                            type: 'button',
                            onClick: () => {
                                setSelectedEp(prev => Math.min(maxEp, prev + 1));
                                setSelectedPlayerId(null);
                            },
                            disabled: selectedEp >= maxEp,
                            title: 'Next Episode',
                            className: `p-1 text-amber-400 hover:text-amber-200 cursor-pointer transition-transform hover:scale-125 select-none flex items-center justify-center ${selectedEp >= maxEp ? 'opacity-0 pointer-events-none' : 'opacity-80 hover:opacity-100'}`
                        },
                            h('svg', { className: 'w-4 h-4 stroke-current fill-none stroke-[2.5]', viewBox: '0 0 24 24' },
                                h('path', { d: 'M9 18l6-6-6-6', strokeLinecap: 'round', strokeLinejoin: 'round' })
                            )
                        )
                    )
                ),

                // Fixed Baseline Chart Layout (Height 235px, Zero baseline locked at 128px in space)
                h('div', { className: 'relative w-full h-[235px] px-2 sm:px-[60px] pt-2 pb-7 flex items-center justify-around gap-2 sm:gap-4' },
                    roster.length === 0 ? h('div', { className: 'text-center text-slate-400 italic' }, 'No players on roster') :
                    roster.map(player => {
                        const pData = activeEpMap[player.id] || { totalPts: 0, posPts: 0, negPts: 0, events: [] };
                        const netPts = pData.totalPts;
                        const posEvents = pData.events.filter(e => e.pts > 0);
                        const negEvents = pData.events.filter(e => e.pts < 0);

                        const posPx = pData.posPts > 0 ? Math.round((pData.posPts / globalMaxPos) * 80) : 0;
                        const negPx = pData.negPts > 0 ? Math.round((pData.negPts / globalMaxNeg) * 36) : 0;

                        const isSelected = selectedPlayerId === player.id;
                        const isActive = activePlayerId === player.id;
                        const isDimmed = activePlayerId !== null && !isActive;

                        return h('div', {
                            key: player.id,
                            className: `flex-1 flex flex-col items-center h-full relative max-w-[90px] select-none group transition-opacity duration-200 ${
                                isDimmed ? 'opacity-35 hover:opacity-75' : ''
                            }`
                        },
                            // Interactive Graph Container: Hit target on the actual graph area, NO amber rectangle
                            h('div', {
                                role: 'button',
                                tabIndex: 0,
                                'aria-pressed': isSelected,
                                title: `Hover, click, or tap to view all events for ${player.name} in Episode ${selectedEp}`,
                                className: 'w-full max-w-[50px] sm:max-w-[56px] h-[180px] relative transition-transform duration-150 cursor-pointer flex flex-col items-center group',
                                onTouchStart: (e) => {
                                    touchStartXRef.current = e.touches[0].clientX;
                                    touchStartYRef.current = e.touches[0].clientY;
                                    isTouchScrollRef.current = false;
                                },
                                onTouchMove: (e) => {
                                    if (!isTouchScrollRef.current) {
                                        const dx = Math.abs(e.touches[0].clientX - touchStartXRef.current);
                                        const dy = Math.abs(e.touches[0].clientY - touchStartYRef.current);
                                        if (dx > 8 || dy > 8) {
                                            isTouchScrollRef.current = true;
                                        }
                                    }
                                },
                                onTouchEnd: (e) => {
                                    if (!isTouchScrollRef.current) {
                                        lastPlayerTouchTimeRef.current = Date.now();
                                        handlePlayerToggle(player.id, e);
                                    }
                                },
                                onMouseEnter: () => setHoveredPlayerId(player.id),
                                onMouseLeave: () => setHoveredPlayerId(null),
                                onClick: (e) => {
                                    if (Date.now() - lastPlayerTouchTimeRef.current < 450) {
                                        return;
                                    }
                                    handlePlayerToggle(player.id, e);
                                },
                                onKeyDown: (e) => {
                                    if (e.key === 'Enter' || e.key === ' ') {
                                        e.preventDefault();
                                        handlePlayerToggle(player.id, e);
                                    }
                                }
                            },
                                // Net Pts Label
                                h('div', {
                                    className: `text-xs font-black absolute text-center w-full transition-colors ${
                                        isActive ? 'text-amber-300 drop-shadow-md' :
                                        netPts > 0 ? 'text-emerald-400' : 
                                        netPts < 0 ? 'text-red-400' : 'text-slate-400'
                                    }`,
                                    style: { top: `${netPts > 0 ? 128 - posPx - 18 : netPts < 0 ? 128 + negPx + 4 : 108}px` }
                                }, `${netPts}`),

                                // Zero baseline indicator marker (tick)
                                h('div', {
                                    className: `absolute w-6 h-[2px] rounded-full transition-colors ${isActive ? 'bg-amber-400' : 'bg-slate-600/60'}`,
                                    style: { top: '128px' }
                                }),

                                // Positive Stack Container (radiating upward from 128px)
                                posPx > 0 && h('div', {
                                    className: `w-full max-w-[42px] bg-slate-800/60 rounded-t-lg overflow-hidden flex flex-col-reverse shadow-xs border border-amber-900/40 transition-all absolute group-hover:brightness-110 ${
                                        isActive ? 'brightness-110 drop-shadow-[0_0_6px_rgba(251,191,36,0.35)]' : ''
                                    }`,
                                    style: { height: `${posPx}px`, top: `${128 - posPx}px` }
                                },
                                    posEvents.map((ev, evIdx) => {
                                        const segPct = (ev.pts / (pData.posPts || 1)) * 100;
                                        return h('div', {
                                            key: evIdx,
                                            style: { height: `${segPct}%`, backgroundColor: ev.col },
                                            className: 'w-full border-b border-white/20'
                                        });
                                    })
                                ),

                                // Negative Stack Container (radiating downward from 128px)
                                negPx > 0 && h('div', {

        function TeamRosterContributionBar({ roster, getPlayerScore }) {
            const { useMemo } = React;
            const playerColors = ['#f97316', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6', '#f59e0b', '#06b6d4'];
            
            const { items, totalPosScore, totalTeamScore } = useMemo(() => {
                let sumPos = 0;
                let sumNet = 0;
                const list = roster.map((p, idx) => {
                    const score = getPlayerScore(p.id);
                    sumNet += score;
                    if (score > 0) sumPos += score;
                    return {
                        id: p.id,
                        name: p.name,
                        score: score,
                        color: playerColors[idx % playerColors.length]
                    };
                });
                return { items: list, totalPosScore: sumPos, totalTeamScore: sumNet };
            }, [roster, getPlayerScore]);

            if (items.length === 0) return null;

            const positiveItems = items.filter(item => item.score > 0);
            const nonPosItems = items.filter(item => item.score <= 0);

            return h('div', { className: 'bg-slate-900/90 border border-amber-500/30 rounded-xl p-4 mb-4 backdrop-blur-md shadow-xl text-slate-100' },
                h('div', { className: 'mb-3' },
                    h('span', { className: 'font-extrabold text-xs text-amber-400 uppercase tracking-wider' }, 'ROSTER POINT CONTRIBUTION')
                ),

                // Full-width Stacked Horizontal Rectangle Bar
                h('div', { className: 'w-full h-7 bg-slate-950/80 rounded-lg overflow-hidden flex shadow-inner border border-amber-900/60 mb-2' },
                    totalPosScore > 0 ? positiveItems.map(item => {
                        const pct = (item.score / totalPosScore) * 100;
                        return h('div', {
                            key: item.id,
                            style: { width: `${pct}%`, backgroundColor: item.color },
                            className: 'h-full transition-all hover:brightness-125 cursor-pointer relative group flex items-center justify-center border-r border-slate-900/30',
                            title: `${item.name}: ${item.score} pts (${Math.round(pct)}% of positive points)`
                        },
                            pct > 12 && h('span', { className: 'text-[10px] font-black text-white drop-shadow-xs truncate px-1' }, `${Math.round(pct)}%`)
                        );
                    }) : h('div', { className: 'w-full h-full bg-slate-800 flex items-center justify-center text-[11px] text-slate-400 italic' }, 'No positive points recorded')
                ),

                // Player Names Aligned Directly Under Their Respective Section of the Bar
                totalPosScore > 0 && h('div', { className: 'w-full flex text-xs mb-2' },
                    positiveItems.map(item => {
                        const pct = (item.score / totalPosScore) * 100;
                        return h('div', {
                            key: item.id,
                            style: { width: `${pct}%` },
                            className: 'flex flex-col items-center justify-start text-center px-0.5 overflow-hidden'
                        },
                            h('span', { className: 'text-[11px] font-extrabold text-slate-200 truncate w-full' }, item.name.split(' ')[0]),
                            h('span', { className: 'text-[10px] font-black text-amber-400 truncate w-full' }, `${item.score} pts`)
                        );
                    })
                ),

                // Non-positive (0 or negative) scorers displayed neatly below if present
                nonPosItems.length > 0 && h('div', { className: 'flex flex-wrap items-center gap-2 mt-2 pt-2 border-t border-slate-800/80 text-xs' },
                    h('span', { className: 'text-[10px] font-bold text-slate-400 uppercase tracking-wide mr-1' }, 'Other Roster Members:'),
                    nonPosItems.map(item =>
                        h('div', { key: item.id, className: 'flex items-center gap-1.5 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700/60' },
                            h('span', { className: 'w-2.5 h-2.5 rounded-full shrink-0 shadow-xs', style: { backgroundColor: item.score < 0 ? '#ef4444' : '#94a3b8' } }),
                            h('span', { className: 'text-slate-200 font-bold' }, item.name.split(' ')[0]),
                            h('span', { className: `font-extrabold ${item.score < 0 ? 'text-red-400' : 'text-slate-400'}` }, `${item.score} pts`)
                        )
                    )
                )
            );
        }

        function TeamScoreGraph({ leaderboard, scores, eliminationOrder, winner, playerTeams, players, draftState, targetMaxEpisode }) {
            const { useState, useMemo, useRef } = React;
            const [chartMode, setChartMode] = useState('cumulative');
            const [hoveredPoint, setHoveredPoint] = useState(null);
            const [hoveredTeamId, setHoveredTeamId] = useState(null);
            const [selectedTeamId, setSelectedTeamId] = useState(null);

            const lastTeamTouchTimeRef = useRef(0);
            const touchStartXRef = useRef(0);
            const touchStartYRef = useRef(0);
            const isTouchScrollRef = useRef(false);
            const lastPointTouchTimeRef = useRef(0);

            const activeTeamId = selectedTeamId !== null ? selectedTeamId : hoveredTeamId;

            const handleTeamToggle = (teamId, e) => {
                if (e && e.stopPropagation) e.stopPropagation();
                setSelectedTeamId(prev => (prev === teamId ? null : teamId));
            };

            const handlePointToggle = (pointData, e) => {
                if (e && e.stopPropagation) e.stopPropagation();
                setHoveredPoint(prev => {
                    if (prev && prev.teamId === pointData.teamId && prev.episode === pointData.episode) {
                        return null;
                    }
                    return pointData;
                });
            };

            const maxEpisode = useMemo(() => {
                if (targetMaxEpisode !== undefined && targetMaxEpisode !== null && !isNaN(parseInt(targetMaxEpisode))) {
                    return Math.max(0, parseInt(targetMaxEpisode));
                }
                let maxEp = 1;
                Object.values(scores || {}).forEach(playerScores => {
                    Object.keys(playerScores || {}).forEach(ep => {
                        const num = parseInt(ep);
                        if (!isNaN(num) && num > maxEp) maxEp = num;
                    });
                });
                return Math.max(maxEp, 1);
            }, [scores, targetMaxEpisode]);

            const episodes = useMemo(() => {
                const arr = [];
                for (let i = 1; i <= maxEpisode; i++) arr.push(i);
                return arr;
            }, [maxEpisode]);

            const teamColors = [
                { stroke: '#f97316', bg: 'bg-orange-500', hex: '#f97316' },
                { stroke: '#6366f1', bg: 'bg-indigo-500', hex: '#6366f1' },
                { stroke: '#10b981', bg: 'bg-emerald-500', hex: '#10b981' },
                { stroke: '#ec4899', bg: 'bg-pink-500', hex: '#ec4899' },
                { stroke: '#8b5cf6', bg: 'bg-purple-500', hex: '#8b5cf6' },
                { stroke: '#3b82f6', bg: 'bg-blue-500', hex: '#3b82f6' },
                { stroke: '#f59e0b', bg: 'bg-amber-500', hex: '#f59e0b' }
            ];

            const { series, minScoreVal, maxScoreVal } = useMemo(() => {
                let minVal = 0;
                let maxVal = 30;

                const teamSeries = leaderboard.map((team, index) => {
                    const teamStyle = teamColors[index % teamColors.length];
                    const roster = players.filter(p => playerTeams[p.id] === team.id);
                    
                    let cumulative = 0;
                    const playerCumMap = {};
                    roster.forEach(p => { playerCumMap[p.id] = 0; });

                    const history = episodes.map(ep => {
                        let epGain = 0;

                        roster.forEach(player => {
                            let pEpPts = 0;
                            const bfEp = getBackfillEpisode(player.id, draftState);
                            if (bfEp === null || ep >= bfEp) {
                                const playerScores = (scores[player.id] || {})[ep] || {};
                                if (playerScores && typeof playerScores === 'object') {
                                    Object.values(playerScores).forEach(score => {
                                        if (score && typeof score === 'object') {
                                            const pts = (score.points || 0);
                                            cumulative += pts;
                                            epGain += pts;
                                            pEpPts += pts;
                                        }
                                    });
                                }
                                if (eliminationOrder && (eliminationOrder[player.id] === ep || eliminationOrder[String(player.id)] === ep)) {
                                    cumulative += ep;
                                    epGain += ep;
                                    pEpPts += ep;
                                }
                            }
                            playerCumMap[player.id] = (playerCumMap[player.id] || 0) + pEpPts;
                        });

                        if (winner && ep >= 14 && roster.some(p => p.id === parseInt(winner))) {
                            if (ep === 14) {
                                cumulative += 20;
                                epGain += 20;
                            }
                        }

                        const playerBreakdown = roster.map(p => ({
                            name: p.name,
                            pts: playerCumMap[p.id] || 0
                        }));

                        if (cumulative > maxVal) maxVal = cumulative;
                        if (cumulative < minVal) minVal = cumulative;

                        return { episode: ep, score: cumulative, epGain, playerBreakdown };
                    });

                    return {
                        id: team.id,
                        name: team.name,
                        style: teamStyle,
                        currentScore: team.score,
                        roster: roster,
                        history: history
                    };
                });

                return { series: teamSeries, minScoreVal: minVal, maxScoreVal: maxVal };
            }, [leaderboard, scores, episodes, eliminationOrder, winner, playerTeams, players, draftState]);

            if (maxEpisode === 0) {
                return h('div', { className: 'bg-white rounded-2xl p-6 shadow-xl border border-gray-100 mb-8 text-center' },
                    h('div', { className: 'py-8' },
                        h('div', { className: 'text-4xl mb-3' }, '🏝️'),
                        h('h3', { className: 'text-xl font-black text-gray-800 uppercase tracking-wide', style: { fontFamily: '"Bebas Neue", cursive' } }, 'Pre-Season • Prior to Episode 1'),
                        h('p', { className: 'text-sm text-gray-500 font-semibold max-w-md mx-auto mt-1' }, 'No points or eliminations have been scored yet. All fantasy teams are currently tied at 0 points.')
                    )
                );
            }

            const width = 800;
            const height = 300;
            const paddingLeft = 60;
            const paddingRight = 40;
            const paddingTop = 38;
            const paddingBottom = 45;
            const plotWidth = width - paddingLeft - paddingRight;
            const plotHeight = height - paddingTop - paddingBottom;

            const minY = Math.floor((minScoreVal - 5) / 10) * 10;
            const maxY = Math.max(30, Math.ceil((maxScoreVal + 10) / 20) * 20);
            const domainY = maxY - minY || 1;

            const barOffsetMargin = 28;
            const getX = (epIndex, isBarChart = false) => {
                if (episodes.length <= 1) return paddingLeft + plotWidth / 2;
                if (isBarChart) {
                    const availableW = plotWidth - barOffsetMargin * 2;
                    return paddingLeft + barOffsetMargin + (epIndex / (episodes.length - 1)) * availableW;
                }
                return paddingLeft + (epIndex / (episodes.length - 1)) * plotWidth;
            };

            const getY = (val) => paddingTop + plotHeight - ((val - minY) / domainY) * plotHeight;

            const renderChartContent = () => {
                if (chartMode === 'cumulative') {
                    const ySteps = 5;
                    const stepVal = domainY / (ySteps - 1);
                    const gridSteps = Array.from({ length: ySteps }, (_, i) => Math.round(minY + i * stepVal));

                    return h('g', {},
                        gridSteps.map((val, idx) => {
                            const yPos = getY(val);
                            return h('g', { key: idx },
                                h('line', { x1: paddingLeft, y1: yPos, x2: width - paddingRight, y2: yPos, stroke: '#334155', strokeWidth: 1 }),
                                h('text', { x: paddingLeft - 10, y: yPos + 4, textAnchor: 'end', fontSize: 11, fontWeight: 'bold', fill: val < 0 ? '#f87171' : '#94a3b8' }, `${val}p`)
                            );
                        }),
                        minY < 0 && h('line', { x1: paddingLeft, y1: getY(0), x2: width - paddingRight, y2: getY(0), stroke: '#f59e0b', strokeWidth: 2, strokeDasharray: '4 4' }),
                        series.map(s => {
                            const isDimmed = activeTeamId && activeTeamId !== s.id;
                            const pointsStr = s.history.map((h, i) => `${getX(i)},${getY(h.score)}`).join(' ');

                            return h('g', { key: s.id, style: { opacity: isDimmed ? 0.2 : 1, transition: 'opacity 0.2s' } },
                                h('polyline', { fill: 'none', stroke: s.style.stroke, strokeWidth: activeTeamId === s.id ? 5 : 3.5, strokeLinecap: 'round', strokeLinejoin: 'round', points: pointsStr }),
                                s.history.map((pt, i) => {
                                    const cx = getX(i);
                                    const cy = getY(pt.score);
                                    const isHov = hoveredPoint && hoveredPoint.teamId === s.id && hoveredPoint.episode === pt.episode;
                                    return h('g', { key: i },
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: isHov ? 7 : 4.5,
                                            fill: '#ffffff',
                                            stroke: s.style.stroke,
                                            strokeWidth: 2.5
                                        }),
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: 12,
                                            fill: 'transparent',
                                            className: 'cursor-pointer',
                                            onMouseEnter: () => setHoveredPoint({ teamId: s.id, teamName: s.name, episode: pt.episode, score: pt.score, playerBreakdown: pt.playerBreakdown, cx, cy }),
                                            onTouchEnd: (e) => {
                                                e.stopPropagation();
                                                lastPointTouchTimeRef.current = Date.now();
                                                handlePointToggle({ teamId: s.id, teamName: s.name, episode: pt.episode, score: pt.score, playerBreakdown: pt.playerBreakdown, cx, cy }, e);
                                            },
                                            onClick: (e) => {
                                                e.stopPropagation();
                                                if (Date.now() - lastPointTouchTimeRef.current < 450) return;
                                                handlePointToggle({ teamId: s.id, teamName: s.name, episode: pt.episode, score: pt.score, playerBreakdown: pt.playerBreakdown, cx, cy }, e);
                                            },
                                            onMouseLeave: () => setHoveredPoint(null)
                                        })
                                    );
                                })
                            );
                        })
                    );
                }

                if (chartMode === 'weekly') {
                    const maxEpGain = Math.max(15, ...series.flatMap(s => s.history.map(h => h.epGain)));
                    const getBarY = (gain) => paddingTop + plotHeight - (Math.max(0, gain) / maxEpGain) * plotHeight;

                    return h('g', {},
                        [0, Math.round(maxEpGain * 0.5), maxEpGain].map((val, idx) => {
                            const yPos = getBarY(val);
                            return h('g', { key: idx },
                                h('line', { x1: paddingLeft, y1: yPos, x2: width - paddingRight, y2: yPos, stroke: '#334155', strokeWidth: 1 }),
                                h('text', { x: paddingLeft - 10, y: yPos + 4, textAnchor: 'end', fontSize: 11, fontWeight: 'bold', fill: '#94a3b8' }, `${val}p`)
                            );
                        }),
                        episodes.map((ep, epIdx) => {
                            const groupCenterX = getX(epIdx, true);
                            const totalSeries = series.length;
                            const barW = Math.min(14, (plotWidth / (episodes.length * totalSeries)) * 0.85);
                            const groupW = totalSeries * barW;
                            const startX = groupCenterX - groupW / 2;

                            return h('g', { key: ep },
                                series.map((s, sIdx) => {
                                    const pt = s.history[epIdx];
                                    const gain = pt ? pt.epGain : 0;
                                    const bx = startX + sIdx * barW;
                                    const by = getBarY(gain);
                                    const bh = Math.max(2, paddingTop + plotHeight - by);
                                    const isDimmed = activeTeamId && activeTeamId !== s.id;

                                    return h('rect', {
                                        key: s.id,
                                        x: bx,
                                        y: by,
                                        width: barW - 2,
                                        height: bh,
                                        fill: s.style.hex,
                                        rx: 3,
                                        style: { opacity: isDimmed ? 0.15 : 1, transition: 'opacity 0.2s' },
                                        className: 'transition-all hover:brightness-125 cursor-pointer',
                                        onMouseEnter: () => setHoveredPoint({ teamId: s.id, teamName: s.name, episode: ep, score: `${gain >= 0 ? `+${gain}` : gain} pts in Ep ${ep}`, cx: bx + barW/2, cy: by }),
                                        onTouchEnd: (e) => {
                                            e.stopPropagation();
                                            lastPointTouchTimeRef.current = Date.now();
                                            handlePointToggle({ teamId: s.id, teamName: s.name, episode: ep, score: `${gain >= 0 ? `+${gain}` : gain} pts in Ep ${ep}`, cx: bx + barW/2, cy: by }, e);
                                        },
                                        onClick: (e) => {
                                            e.stopPropagation();
                                            if (Date.now() - lastPointTouchTimeRef.current < 450) return;
                                            handlePointToggle({ teamId: s.id, teamName: s.name, episode: ep, score: `${gain >= 0 ? `+${gain}` : gain} pts in Ep ${ep}`, cx: bx + barW/2, cy: by }, e);
                                        },
                                        onMouseLeave: () => setHoveredPoint(null)
                                    });
                                })
                            );
                        })
                    );
                }

                if (chartMode === 'rank') {
                    const totalTeams = series.length;
                    const getRankY = (rankNum) => paddingTop + ((rankNum - 1) / Math.max(1, totalTeams - 1)) * plotHeight;

                    return h('g', {},
                        Array.from({ length: totalTeams }, (_, i) => i + 1).map(r => {
                            const yPos = getRankY(r);
                            return h('g', { key: r },
                                h('line', { x1: paddingLeft, y1: yPos, x2: width - paddingRight, y2: yPos, stroke: '#334155', strokeWidth: 1 }),
                                h('text', { x: paddingLeft - 10, y: yPos + 4, textAnchor: 'end', fontSize: 11, fontWeight: 'bold', fill: '#f97316' }, `Rank #${r}`)
                            );
                        }),
                        series.map(s => {
                            const isDimmed = activeTeamId && activeTeamId !== s.id;
                            const rankHistory = episodes.map((ep, epIdx) => {
                                const epScores = series.map(ts => ({ id: ts.id, score: ts.history[epIdx].score }));
                                epScores.sort((a, b) => b.score - a.score);
                                const rIndex = epScores.findIndex(item => item.id === s.id);
                                return { episode: ep, rank: rIndex + 1 };
                            });

                            const pointsStr = rankHistory.map((rh, i) => `${getX(i)},${getRankY(rh.rank)}`).join(' ');
                            return h('g', { key: s.id, style: { opacity: isDimmed ? 0.15 : 1, transition: 'opacity 0.2s' } },
                                h('polyline', { fill: 'none', stroke: s.style.stroke, strokeWidth: activeTeamId === s.id ? 5 : 3.5, strokeLinecap: 'round', strokeLinejoin: 'round', points: pointsStr }),
                                rankHistory.map((rh, i) => {
                                    const cx = getX(i);
                                    const cy = getRankY(rh.rank);
                                    return h('g', { key: i },
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: 5,
                                            fill: '#ffffff',
                                            stroke: s.style.stroke,
                                            strokeWidth: 2.5
                                        }),
                                        h('circle', {
                                            cx: cx,
                                            cy: cy,
                                            r: 12,
                                            fill: 'transparent',
                                            className: 'cursor-pointer',
                                            onMouseEnter: () => setHoveredPoint({ teamId: s.id, teamName: s.name, episode: rh.episode, score: `Rank #${rh.rank} in Ep ${rh.episode}`, cx, cy }),
                                            onTouchEnd: (e) => {
                                                e.stopPropagation();
                                                lastPointTouchTimeRef.current = Date.now();
                                                handlePointToggle({ teamId: s.id, teamName: s.name, episode: rh.episode, score: `Rank #${rh.rank} in Ep ${rh.episode}`, cx, cy }, e);
                                            },
                                            onClick: (e) => {
                                                e.stopPropagation();
                                                if (Date.now() - lastPointTouchTimeRef.current < 450) return;
                                                handlePointToggle({ teamId: s.id, teamName: s.name, episode: rh.episode, score: `Rank #${rh.rank} in Ep ${rh.episode}`, cx, cy }, e);
                                            },
                                            onMouseLeave: () => setHoveredPoint(null)
                                        })
                                    );
                                })
                            );
                        })
                    );
                }

                if (chartMode === 'roi') {
                    const numTeams = series.length || 5;
                    const picksArr = (draftState && Array.isArray(draftState.picks)) ? draftState.picks : [];

                    const allPlayersWithMeta = series.flatMap(s => s.roster.map((p, pIdx) => {
                        const isBf = getBackfillEpisode(p.id, draftState) !== null || Boolean(draftState && draftState.backfilledPlayers && (draftState.backfilledPlayers[p.id] || draftState.backfilledPlayers[String(p.id)]));
                        const pScores = (scores || {})[p.id] || (scores || {})[String(p.id)] || {};
                        const totalPts = Math.round(
                            Object.values(pScores)
                                .filter(e => e && typeof e === 'object')
                                .flatMap(e => Object.values(e))
                                .reduce((a, b) => a + ((b && typeof b === 'object' && b.points) ? b.points : 0), 0)
                        );

                        const pickObj = picksArr.find(pk => String(pk.playerId) === String(p.id) || (pk.name && pk.name === p.name));
                        const sIdx = series.findIndex(ts => ts.id === s.id);
                        const fallbackPickNum = pIdx * numTeams + (sIdx >= 0 ? sIdx + 1 : 1);
                        const overallPick = pickObj && pickObj.pickNumber ? pickObj.pickNumber : fallbackPickNum;

                        return {
                            id: p.id,
                            teamId: s.id,
                            name: p.name,
                            teamName: s.name,
                            color: s.style.hex,
                            isBackfill: isBf,
                            overallPick: overallPick,
                            score: totalPts
                        };
                    }));

                    const draftedOnly = allPlayersWithMeta.filter(p => !p.isBackfill);
                    draftedOnly.sort((a, b) => a.overallPick - b.overallPick);

                    const backfilledOnly = allPlayersWithMeta.filter(p => p.isBackfill);
                    const allDisplay = [...draftedOnly, ...backfilledOnly];

                    const maxPts = Math.max(30, ...allDisplay.map(d => d.score));
                    const minPts = Math.min(0, ...allDisplay.map(d => d.score));
                    const domainPts = maxPts - minPts || 1;

                    const roiTop = 82;
                    const roiBottom = 275;
                    const roiPlotHeight = roiBottom - roiTop;
                    const zeroY = roiTop + roiPlotHeight - ((0 - minPts) / domainPts) * roiPlotHeight;
                    const barW = Math.min(26, (plotWidth / Math.max(1, allDisplay.length)) * 0.8);

                    // Point range ticks for Y-axis scale
                    const rawTicks = [maxPts, Math.round((maxPts + Math.min(0, minPts)) / 2), 0, ...(minPts < 0 ? [minPts] : [])];
                    const uniqueTicks = [...new Set(rawTicks)].sort((a, b) => b - a);

                    return h('g', {},
                        // Minimal Y-Axis scale lines & labels (points range)
                        uniqueTicks.map((tickVal, tIdx) => {
                            const tickY = roiTop + roiPlotHeight - ((tickVal - minPts) / domainPts) * roiPlotHeight;
                            const isZero = tickVal === 0;
                            return h('g', { key: 'ytick-' + tIdx },
                                h('line', {
                                    x1: paddingLeft - 6,
                                    y1: tickY,
                                    x2: width - paddingRight + 6,
                                    y2: tickY,
                                    stroke: isZero ? (minPts < 0 ? '#ef4444' : '#475569') : '#334155',
                                    strokeWidth: isZero ? 1.5 : 1,
                                    strokeDasharray: isZero ? (minPts < 0 ? '4 3' : 'none') : '2 2',
                                    opacity: isZero ? 0.9 : 0.4
                                }),
                                h('text', {
                                    x: paddingLeft - 10,
                                    y: tickY + 4,
                                    textAnchor: 'end',
                                    fontSize: 9,
                                    fontWeight: '800',
                                    fill: isZero ? '#94a3b8' : '#64748b'
                                }, `${tickVal > 0 ? '+' : ''}${tickVal}p`)
                            );
                        }),

                        // Horizontal Separation Line below Pick Numbers
                        h('line', {
                            x1: paddingLeft - 10,
                            y1: 26,
                            x2: width - paddingRight + 10,
                            y2: 26,
                            stroke: '#475569',
                            strokeWidth: 1.5,
                            opacity: 0.6
                        }),

                        allDisplay.map((item, i) => {
                            const bx = paddingLeft + (i / Math.max(1, allDisplay.length - 1)) * (plotWidth - barW);
                            const bh = Math.max(2, (Math.abs(item.score) / domainPts) * roiPlotHeight);
                            const by = item.score >= 0 ? zeroY - bh : zeroY;

                            const isFirstBackfill = item.isBackfill && (i === 0 || !allDisplay[i - 1].isBackfill);
                            const isNewRound = !item.isBackfill && i > 0 && i % numTeams === 0;

                            const prevBx = i > 0 ? paddingLeft + ((i - 1) / Math.max(1, allDisplay.length - 1)) * (plotWidth - barW) : bx;
                            const divX = (prevBx + barW + bx) / 2;

                            let pickFormatted = '';
                            if (item.isBackfill) {
                                pickFormatted = 'BF';
                            } else {
                                const pickNum = item.overallPick || (i + 1);
                                const roundNum = Math.floor((pickNum - 1) / numTeams) + 1;
                                const pickInRound = ((pickNum - 1) % numTeams) + 1;
                                pickFormatted = `${roundNum}.${pickInRound}`;
                            }

                            const isDimmed = activeTeamId && activeTeamId !== item.teamId;

                            return h('g', { key: item.id || i, style: { opacity: isDimmed ? 0.15 : 1, transition: 'opacity 0.2s' } },
                                // Vertical Round Divider Line
                                isNewRound && h('g', { key: 'div-' + i },
                                    h('line', { x1: divX, y1: 26, x2: divX, y2: roiBottom + 4, stroke: '#f59e0b', strokeWidth: 1.5, strokeDasharray: '4 3', opacity: 0.6 }),
                                    h('text', { x: divX + 3, y: 36, fontSize: 8, fontWeight: '900', fill: '#fbbf24' }, `R${Math.floor(i / numTeams) + 1}`)
                                ),

                                // Backfill Section Divider Line
                                isFirstBackfill && h('g', { key: 'bf-div-' + i },
                                    h('line', { x1: divX, y1: 26, x2: divX, y2: roiBottom + 4, stroke: '#ec4899', strokeWidth: 2, strokeDasharray: '4 3', opacity: 0.8 }),
                                    h('text', { x: divX + 3, y: 36, fontSize: 8, fontWeight: '900', fill: '#f472b6' }, 'Backfill')
                                ),

                                // Draft Pick Number aligned on fixed Y line (y = 16)
                                h('text', {
                                    x: bx + barW/2,
                                    y: 16,
                                    textAnchor: 'middle',
                                    fontSize: 10,
                                    fontWeight: '900',
                                    fill: item.score < 0 ? '#ef4444' : item.isBackfill ? '#f472b6' : item.color
                                }, pickFormatted),

                                // Rotated Castaway Name at the top slanted up-right under separation line
                                h('text', {
                                    x: bx + barW/2,
                                    y: 74,
                                    textAnchor: 'start',
                                    fontSize: 9,
                                    fontWeight: '800',
                                    fill: '#f8fafc',
                                    transform: `rotate(-40 ${bx + barW/2} 74)`
                                }, item.name.split(' ')[0]),

                                // Bar Graph Rect
                                h('rect', {
                                    x: bx,
                                    y: by,
                                    width: barW,
                                    height: bh,
                                    fill: item.color,
                                    stroke: item.score < 0 ? '#ef4444' : 'none',
                                    strokeWidth: item.score < 0 ? 1.5 : 0,
                                    rx: 3,
                                    className: 'hover:brightness-125 cursor-pointer transition-all',
                                    onMouseEnter: () => setHoveredPoint({ teamId: item.teamId, teamName: item.teamName, episode: item.name, score: `${item.name} (${item.teamName}): ${item.score} pts ${item.isBackfill ? '(Backfilled)' : `(Pick ${pickFormatted})`}`, cx: bx + barW/2, cy: by }),
                                    onTouchEnd: (e) => {
                                        e.stopPropagation();
                                        lastPointTouchTimeRef.current = Date.now();
                                        handlePointToggle({ teamId: item.teamId, teamName: item.teamName, episode: item.name, score: `${item.name} (${item.teamName}): ${item.score} pts ${item.isBackfill ? '(Backfilled)' : `(Pick ${pickFormatted})`}`, cx: bx + barW/2, cy: by }, e);
                                    },
                                    onClick: (e) => {
                                        e.stopPropagation();
                                        if (Date.now() - lastPointTouchTimeRef.current < 450) return;
                                        handlePointToggle({ teamId: item.teamId, teamName: item.teamName, episode: item.name, score: `${item.name} (${item.teamName}): ${item.score} pts ${item.isBackfill ? '(Backfilled)' : `(Pick ${pickFormatted})`}`, cx: bx + barW/2, cy: by }, e);
                                    },
                                    onMouseLeave: () => setHoveredPoint(null)
                                })
                            );
                        })
                    );
                }
            };

            const getTooltipPositionStyle = () => {
                if (!hoveredPoint) return {};
                let leftPct = (hoveredPoint.cx / width) * 100;
                leftPct = Math.max(12, Math.min(88, leftPct));
                const topPct = (hoveredPoint.cy / height) * 100;
                
                const isNearTop = hoveredPoint.cy < 110;
                const isNearRight = hoveredPoint.cx > width * 0.72;
                const isNearLeft = hoveredPoint.cx < width * 0.28;

                let translateX = '-50%';
                if (isNearRight) translateX = '-88%';
                if (isNearLeft) translateX = '-10%';

                let translateY = isNearTop ? '15px' : 'calc(-100% - 14px)';

                return {
                    left: `${leftPct}%`,
                    top: `${topPct}%`,
                    transform: `translate(${translateX}, ${translateY})`
                };
            };

            return h('div', {
                className: 'bg-slate-900/90 backdrop-blur-md rounded-2xl p-4 md:p-6 mb-8 shadow-2xl border border-amber-500/30 text-slate-100',
                onClick: () => setHoveredPoint(null)
            },
                // Centered Visualization Navigation Selector
                h('div', { className: 'flex justify-center items-center mb-4 md:mb-5 w-full' },
                    h('div', { className: 'flex bg-slate-950/80 p-1.5 rounded-xl gap-1 md:gap-1.5 flex-wrap text-xs font-bold border border-amber-900/60 shadow-inner justify-center' },
                        [
                            { id: 'cumulative', label: '📈 Cumulative' },
                            { id: 'weekly', label: '📊 Weekly Gains' },
                            { id: 'rank', label: '🏆 Rank Trajectory' },
                            { id: 'roi', label: '💡 Draft ROI' }
                        ].map(t => h('button', {
                            key: t.id,
                            onClick: (e) => { e.stopPropagation(); setChartMode(t.id); setHoveredPoint(null); },
                            className: `px-3 py-1.5 rounded-lg transition-all cursor-pointer ${
                                chartMode === t.id ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white font-black shadow-md border border-amber-400/50 scale-105' : 'text-amber-200/70 hover:text-white hover:bg-slate-800/80'
                            }`
                        }, t.label))
                    )
                ),

                // Main Layout: Responsive Team Legend (Row on Mobile, Vertical Stack on Desktop) + Touch-Scrollable SVG Graph
                h('div', { className: 'flex flex-col md:flex-row items-stretch md:items-center justify-center gap-4 w-full overflow-visible' },
                    // Team Legend Cards: Flex row wrap on mobile (< md), vertical stack on desktop (>= md)
                    h('div', { className: 'flex flex-row flex-wrap md:flex-col justify-center gap-1.5 md:gap-2 shrink-0 w-full md:w-auto my-auto' },
                        series.map(s => {
                            const isSelected = selectedTeamId === s.id;
                            const isHovered = hoveredTeamId === s.id && !selectedTeamId;
                            const isDimmed = activeTeamId && activeTeamId !== s.id;

                            let buttonClasses = 'flex items-center justify-between gap-2 px-3 py-1.5 rounded-xl border transition-all cursor-pointer text-left ';
                            if (isSelected) {
                                buttonClasses += 'bg-amber-950 border-amber-400 scale-[1.04] shadow-lg text-amber-200 ring-2 ring-amber-400/80';
                            } else if (isHovered) {
                                buttonClasses += 'bg-amber-950/70 border-amber-500/70 scale-[1.02] shadow-md text-amber-200';
                            } else if (isDimmed) {
                                buttonClasses += 'bg-slate-800/40 border-slate-800/60 text-slate-400 opacity-60 hover:opacity-90';
                            } else {
                                buttonClasses += 'bg-slate-800/80 border-amber-900/40 text-slate-300 hover:bg-slate-800';
                            }

                            return h('button', {
                                key: s.id,
                                type: 'button',
                                'aria-pressed': isSelected,
                                title: isSelected ? `${s.name}: Selected (Tap to deselect)` : `${s.name}: Tap to highlight on graph`,
                                onTouchStart: (e) => {
                                    if (e.touches && e.touches[0]) {
                                        touchStartXRef.current = e.touches[0].clientX;
                                        touchStartYRef.current = e.touches[0].clientY;
                                        isTouchScrollRef.current = false;
                                    }
                                },
                                onTouchMove: (e) => {
                                    if (e.touches && e.touches[0]) {
                                        const dx = Math.abs(e.touches[0].clientX - touchStartXRef.current);
                                        const dy = Math.abs(e.touches[0].clientY - touchStartYRef.current);
                                        if (dx > 8 || dy > 8) {
                                            isTouchScrollRef.current = true;
                                        }
                                    }
                                },
                                onTouchEnd: (e) => {
                                    e.stopPropagation();
                                    lastTeamTouchTimeRef.current = Date.now();
                                    if (!isTouchScrollRef.current) {
                                        handleTeamToggle(s.id, e);
                                    }
                                },
                                onClick: (e) => {
                                    e.stopPropagation();
                                    if (Date.now() - lastTeamTouchTimeRef.current < 450) {
                                        return; // Ignore synthetic click from touch gesture
                                    }
                                    handleTeamToggle(s.id, e);
                                },
                                onMouseEnter: () => {
                                    if (Date.now() - lastTeamTouchTimeRef.current > 600) {
                                        setHoveredTeamId(s.id);
                                    }
                                },
                                onMouseLeave: () => setHoveredTeamId(null),
                                className: buttonClasses
                            },
                                h('div', { className: 'flex items-center gap-2 min-w-0' },
                                    h('span', { className: `w-3 h-3 rounded-full shrink-0 ${s.style.bg} ${isSelected ? 'ring-2 ring-white' : ''}` }),
                                    h('span', { className: `font-bold text-xs truncate ${isSelected ? 'text-white font-black' : ''}` }, s.name)
                                ),
                                h('div', { className: 'flex items-center gap-1.5 shrink-0 ml-1' },
                                    h('span', { className: `font-extrabold text-xs ${isSelected ? 'text-amber-300' : 'text-amber-400'}` }, `${s.currentScore} pts`),
                                    isSelected && h('span', { className: 'text-[10px] font-black text-amber-400' }, '✓')
                                )
                            );
                        })
                    ),

                    // SVG Graph Container with Horizontal Touch-Scroll for Mobile Viewports
                    h('div', { className: 'flex-1 w-full relative overflow-x-auto overflow-y-hidden scrollbar-thin py-1 touch-pan-x' },
                        h('svg', { 
                            viewBox: `0 0 ${width} ${height}`, 
                            className: 'w-full h-auto max-h-[340px] min-w-[580px] md:min-w-0 overflow-visible'
                        },
                            renderChartContent(),
                        
                        chartMode !== 'roi' && episodes.map((ep, idx) => {
                            const xPos = getX(idx, chartMode === 'weekly');
                            return h('text', {
                                key: ep,
                                x: xPos,
                                y: height - 12,
                                textAnchor: 'middle',
                                fontSize: 11,
                                fontWeight: 'bold',
                                fill: '#94a3b8'
                            }, `Ep ${ep}`);
                        })
                    ),

                    hoveredPoint && h('div', {
                        className: 'absolute z-30 bg-slate-900 text-white text-xs font-bold px-3 py-2.5 rounded-xl shadow-2xl border border-slate-700 pointer-events-none min-w-[160px]',
                        style: getTooltipPositionStyle()
                    },
                        h('div', { className: 'text-orange-400 font-black border-b border-slate-800 pb-1 mb-1.5 flex justify-between items-center gap-2' },
                            h('span', {}, hoveredPoint.teamName),
                            typeof hoveredPoint.score === 'number' && h('span', { className: 'text-slate-300 font-extrabold' }, `Ep ${hoveredPoint.episode}: ${hoveredPoint.score}p`)
                        ),
                        typeof hoveredPoint.score === 'string' && h('div', { className: 'text-slate-200 font-bold mb-1' }, hoveredPoint.score),
                        hoveredPoint.playerBreakdown && Array.isArray(hoveredPoint.playerBreakdown) && h('div', { className: 'space-y-1 pt-0.5' },
                            h('div', { className: 'text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5' }, 'Roster Cumulative:'),
                            hoveredPoint.playerBreakdown.map((p, pIdx) => h('div', { key: pIdx, className: 'flex justify-between items-center text-[11px] text-slate-300' },
                                h('span', { className: 'text-slate-400 font-semibold' }, p.name),
                                h('span', { className: `font-bold ${p.pts > 0 ? 'text-emerald-400' : p.pts < 0 ? 'text-red-400' : 'text-slate-500'}` }, `${p.pts} pts`)
                            ))
                        )
                    )
                )
            )
        );
    }

        function EpisodesScoredTracker({ scores, eliminationOrder, scoredEpisodes = {}, onEpisodeClick, theme }) {
            const episodes = Array.from({ length: 14 }, (_, i) => i + 1);

            const episodeStates = episodes.map(ep => {
                // State 1: Completed / Voted Out or Explicitly Scored
                const hasVotedOut = Object.entries(eliminationOrder || {}).some(([playerId, elimEp]) => {
                    return parseInt(elimEp) === ep;
                });
                const isExplicitlyScored = Boolean(scoredEpisodes && (scoredEpisodes[ep] || scoredEpisodes[`episode-${ep}`]));

                if (hasVotedOut || isExplicitlyScored) {
                    return { ep, status: 'completed', label: 'Completed', icon: '✓' };
                }

                // State 2: Being Scored / In Progress
                let hasPoints = false;
                let pointsCount = 0;
                Object.values(scores || {}).forEach(playerScores => {
                    if (playerScores && playerScores[ep]) {
                        const numScores = Object.keys(playerScores[ep]).length;
                        if (numScores > 0) {
                            hasPoints = true;
                            pointsCount += numScores;
                        }
                    }
                });

                if (hasPoints) {
                    return { ep, status: 'in-progress', label: 'Being Scored', icon: '⚪', count: pointsCount };
                }

                // State 3: Unscored / Not Started
                return { ep, status: 'unscored', label: 'Unscored', icon: '✗' };
            });

            const isTribal = theme === 'tribal';

            return h('div', { className: 'bg-white/90 backdrop-blur-md rounded-xl px-4 py-3 mb-6 shadow-md border border-gray-100/80 flex flex-col md:flex-row items-start md:items-center justify-between gap-3' },
                h('div', { className: 'flex items-center gap-2.5 flex-shrink-0' },
                    h('span', { className: 'text-base' }, '📺'),
                    h('span', { className: 'text-xs font-black uppercase tracking-wider text-gray-800 font-mono' }, 'Episodes Scored:'),
                    h('div', { className: 'hidden sm:flex items-center gap-2 text-[10px] font-bold text-gray-500 border-l border-gray-200 pl-2.5' },
                        h('span', { className: 'flex items-center gap-1' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-emerald-500' }), 'Scored (✓)'),
                        h('span', { className: 'flex items-center gap-1' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-slate-400' }), 'In Progress (⚪)'),
                        h('span', { className: 'flex items-center gap-1' }, h('span', { className: 'w-1.5 h-1.5 rounded-full bg-amber-700/40 border border-amber-900/40' }), 'Unscored (✗)')
                    )
                ),

                h('div', { className: 'flex flex-wrap items-center gap-1.5 w-full md:w-auto overflow-x-auto py-0.5' },
                    episodeStates.map(item => {
                        let badgeStyle = '';

                        if (item.status === 'completed') {
                            badgeStyle = isTribal 
                                ? 'bg-emerald-950/80 border-emerald-500/70 text-emerald-300 hover:bg-emerald-900 shadow-xs' 
                                : 'bg-green-100 border-green-500 text-green-900 hover:bg-green-200 shadow-xs';
                        } else if (item.status === 'in-progress') {
                            badgeStyle = isTribal 
                                ? 'bg-slate-800/90 border-slate-400/70 text-slate-200 hover:bg-slate-700 shadow-xs' 
                                : 'bg-gray-200 border-gray-400 text-gray-800 hover:bg-gray-300 shadow-xs';
                        } else {
                            badgeStyle = isTribal 
                                ? 'bg-amber-950/20 border-amber-900/40 text-amber-300/40 hover:bg-amber-900/30 hover:text-amber-200/80' 
                                : 'bg-gray-50 border-gray-300 text-gray-400 hover:bg-gray-100 hover:text-gray-600 shadow-xs';
                        }

                        return h('button', {
                            key: item.ep,
                            type: 'button',
                            onClick: () => onEpisodeClick(item.ep),
                            title: `Episode ${item.ep}: ${item.label} (Click to add points)`,
                            className: `px-2 py-1 rounded-lg border text-[11px] font-bold font-mono flex items-center gap-1 transition-all duration-150 cursor-pointer ${badgeStyle}`
                        },
                            h('span', {}, `E${item.ep}`),
                            h('span', { className: 'text-[10px] font-black' }, item.icon)
                        );
                    })
                )

        function InstallAppModal({ isOpen, onClose }) {
            const [copied, setCopied] = useState(false);

            if (!isOpen) return null;

            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            const shareUrl = window.location.origin + basePath + 'install.html';
            const displayUrl = (window.location.hostname + basePath).replace(/\/$/, '');

            const handleCopyLink = () => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        setCopied(true);
                        setTimeout(() => setCopied(false), 2500);
                    }).catch(() => fallbackCopy());
                } else {
                    fallbackCopy();
                }
            };

            const fallbackCopy = () => {
                const input = document.createElement('input');
                input.value = shareUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                setCopied(true);
                setTimeout(() => setCopied(false), 2500);

            const handleSaveBulkEdit = () => {
                const rawContestants = seasonData?.contestants;
                const contestantList = (rawContestants && ensureArray(rawContestants).length > 0)
                    ? ensureArray(rawContestants)
                    : ensureArray(defaultSeason51Players);
                const epNum = parseInt(bulkEditEpisode) || 1;

                const updatedContestants = contestantList.map(p => {
                    const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                    if (elimEp && parseInt(elimEp) < epNum) return p;

                    const newTribe = bulkAssignments[p.id] || bulkAssignments[String(p.id)];
                    if (!newTribe) return p;

                    const priorTribe = getPriorTribe(p, epNum);
                    const isSame = newTribe.trim().toLowerCase() === priorTribe.trim().toLowerCase();

                    let history = p.tribeHistory ? [...p.tribeHistory] : [
                        { episode: 1, tribe: p.startingTribe || p.tribe || 'Unassigned', type: 'starting', label: `Starting Tribe: ${p.startingTribe || p.tribe}` }
                    ];

                    if (epNum === 1) {
                        const existingIdx = history.findIndex(h => parseInt(h.episode) === 1);
                        const startEntry = { episode: 1, tribe: newTribe, type: 'starting', label: `Starting Tribe: ${newTribe}` };
                        if (existingIdx !== -1) {
                            history[existingIdx] = startEntry;
                        } else {
                            history.push(startEntry);
                        }
                    } else {
                        const existingIdx = history.findIndex(h => parseInt(h.episode) === epNum);
                        if (isSame) {
                            if (existingIdx !== -1) {
                                history.splice(existingIdx, 1);
                            }
                        } else {
                            const isMerge = newTribe.toLowerCase().includes('merge');
                            const eventType = isMerge ? 'Merged' : 'Tribe Swap';
                            const eventLabel = isMerge ? `Merged into ${newTribe}` : `Tribe Swap to ${newTribe}`;

                                breakdown.push({
