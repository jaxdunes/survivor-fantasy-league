        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            overflow-y: auto;
            width: 100%;
        }

        /* Mobile GPU Composition & Hardware Acceleration for Player Photos */
        .player-photo-avatar {
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            isolation: isolate;
        }

        /* Tribal Council Theme (Earthy Dark Brown & Faint Bottom Fire Glow) */
        @keyframes fireFlicker {
            0%, 100% {
                opacity: 0.8;
                transform: scaleY(1.0) translateY(0);
                filter: drop-shadow(0 -10px 25px rgba(249, 115, 22, 0.4));
            }
            25% {
                opacity: 0.95;
                transform: scaleY(1.04) translateY(-4px);
                filter: drop-shadow(0 -15px 35px rgba(245, 158, 11, 0.5));
            }
            50% {
                opacity: 0.7;
                transform: scaleY(0.96) translateY(2px);
                filter: drop-shadow(0 -8px 20px rgba(239, 68, 68, 0.35));
            }
            75% {
                opacity: 0.9;
                transform: scaleY(1.02) translateY(-2px);
                filter: drop-shadow(0 -12px 30px rgba(251, 146, 60, 0.45));
            }
        }

        body.theme-tribal {
            position: relative !important;
            background: radial-gradient(circle at 50% 10%, #291c14 0%, #160f0a 55%, #0a0604 100%) !important;
            background-attachment: fixed !important;
            color: #f3eae1 !important;
        }

        body.theme-tribal .grey-ombre-bg {
            background: transparent !important;
            position: relative !important;
            z-index: 2 !important;
        }

            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 680px;

                    #000000 48%, 
                    #050403 70%, 
                    rgba(15, 10, 7, 0.8) 86%, 
                    transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Faint Fire Flame Glow coming from Bottom of Screen */
        body.theme-tribal::after {
            content: '';
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 260px;
            background: radial-gradient(ellipse at 50% 120%, 
                rgba(255, 100, 0, 0.35) 0%, 
                rgba(245, 158, 11, 0.20) 35%, 
                rgba(180, 50, 10, 0.08) 60%, 
                transparent 80%);

            z-index: 1;
            animation: fireFlicker 3.5s ease-in-out infinite;
            transform-origin: bottom center;
            will-change: transform, opacity;
            transform: translateZ(0);

            const currentLeagueConfig = LEAGUES_DATA[activeLeagueId] || LEAGUES_DATA['jackson-ryan-league'];
            const seasonConfig = (currentLeagueConfig.seasons || []).find(s => s.id === activeSeasonId) || {};
            const teams = seasonConfig.teams || currentLeagueConfig.teams;
            
            const [playerTeams, setPlayerTeams] = useState({});
            const [seasonData, setSeasonData] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterEra, setFilterEra] = useState('all');
            const [filterTribe, setFilterTribe] = useState('all');
            const [filterTeam, setFilterTeam] = useState('all');
            const [viewMode, setViewMode] = useState('players');
            const [showPlayerDetail, setShowPlayerDetail] = useState(false);
            const [playerDetailId, setPlayerDetailId] = useState(null);
            const [showTeamModal, setShowTeamModal] = useState(false);
            const [playerToAssign, setPlayerToAssign] = useState(null);
            const [showSideMenu, setShowSideMenu] = useState(false);
            const [connected, setConnected] = useState(window.firebaseInitialized);
            const [theme, setTheme] = useState(() => localStorage.getItem('survivor_theme') || 'tribal');

            // Draft Upgrade State Machine & Settings
            const [draftState, setDraftState] = useState({
                status: 'closed',
                style: 'snake',
                orderType: 'random',
                backfillEnabled: true,
                currentRound: 1,
                currentPick: 1,

                onTheClockTeamId: null,

                backfilledPlayers: {}
            });
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [showSafetyResetModal, setShowSafetyResetModal] = useState(false);
            const [showAuctionModal, setShowAuctionModal] = useState(false);
            const [auctionNominatedPlayerId, setAuctionNominatedPlayerId] = useState(null);
            const [auctionBid, setAuctionBid] = useState(1);
            const [auctionHighBidder, setAuctionHighBidder] = useState(null);
            const [elapsedSeconds, setElapsedSeconds] = useState(0);

            const [scores, setScores] = useState({});
            const [eliminationOrder, setEliminationOrder] = useState({});
            const [scoredEpisodes, setScoredEpisodes] = useState({});
            const [currentEpisode, setCurrentEpisode] = useState(1);

            // Tribe Management State
            const [editingPlayer, setEditingPlayer] = useState(null);
            const [singleEditEpisode, setSingleEditEpisode] = useState(1);
            const [singleEditTribe, setSingleEditTribe] = useState('');
            
            const [showAddCustomTribeModal, setShowAddCustomTribeModal] = useState(false);
            const [customTribeName, setCustomTribeName] = useState('');
            const [customTribeColor, setCustomTribeColor] = useState('green');
            const [customTribeEmoji, setCustomTribeEmoji] = useState('🌿');

            const [showBulkEditModal, setShowBulkEditModal] = useState(false);
            const [bulkEditEpisode, setBulkEditEpisode] = useState(1);
            const [bulkAssignments, setBulkAssignments] = useState({});
            const [draggedPlayerId, setDraggedPlayerId] = useState(null);
            const [showConfirmMergeModal, setShowConfirmMergeModal] = useState(false);

            // Load scores, eliminationOrder, scoredEpisodes & currentEpisode
            useEffect(() => {
                if (!window.firebaseInitialized) {
                    const savedScores = localStorage.getItem(`survivor-scores-${activeLeagueId}-${activeSeasonId}`);
                    if (savedScores) setScores(JSON.parse(savedScores));
                    const savedElims = localStorage.getItem(`survivor-eliminationOrder-${activeLeagueId}-${activeSeasonId}`);
                    if (savedElims) setEliminationOrder(JSON.parse(savedElims));
                    return;
                }
                const seasonBasePath = `leagues/${activeLeagueId}/seasons/${activeSeasonId}`;
                const scoresRef = database.ref(`${seasonBasePath}/scores`);
                const elimRef = database.ref(`${seasonBasePath}/eliminationOrder`);
                const scoredRef = database.ref(`${seasonBasePath}/scoredEpisodes`);
                const currEpRef = database.ref('currentEpisode');

                scoresRef.on('value', (snap) => setScores(snap.val() || {}));
                elimRef.on('value', (snap) => setEliminationOrder(snap.val() || {}));
                scoredRef.on('value', (snap) => setScoredEpisodes(snap.val() || {}));
                currEpRef.on('value', (snap) => setCurrentEpisode(snap.val() || 1));

                return () => {
                    scoresRef.off();
                    elimRef.off();
                    scoredRef.off();
                    currEpRef.off();
                };
            }, [activeLeagueId, activeSeasonId]);

            useEffect(() => {
                document.body.classList.toggle('theme-tribal', theme === 'tribal');
            }, [theme]);
            
            const ensureArray = (val) => {
                if (!val) return [];
                if (Array.isArray(val)) return val;
                if (typeof val === 'object') return Object.values(val);
                return [];
            };

            // Load season preset data & subscribe to real-time season updates across all leagues
            useEffect(() => {
                let seasonRef;
                const savedLocal = localStorage.getItem(`survivor-seasonData-${activeSeasonId}`);
                const localData = savedLocal ? JSON.parse(savedLocal) : null;

                fetch('seasons/' + activeSeasonId + '.json?t=' + Date.now())
                    .then(res => res.json())
                    .then(presetData => {
                        const initialContestants = (localData?.contestants && ensureArray(localData.contestants).length > 0)
                            ? ensureArray(localData.contestants)
                            : ensureArray(presetData.contestants);
                        const initialCustom = (localData?.customTribes && ensureArray(localData.customTribes).length > 0)
                            ? ensureArray(localData.customTribes)
                            : ensureArray(presetData.customTribes);

                        setSeasonData(prev => {
                            if (prev) return prev;
                            return {
                                ...presetData,
                                ...localData,
                                contestants: initialContestants,
                                customTribes: initialCustom
                            };
                        });

                        if (window.firebaseInitialized) {
                            seasonRef = database.ref(`seasons/${activeSeasonId}`);
                            seasonRef.on('value', (snap) => {
                                if (snap.exists()) {
                                    const fbSeason = snap.val() || {};
                                    const fbContestants = fbSeason.contestants ? ensureArray(fbSeason.contestants) : null;
                                    const fbCustom = fbSeason.customTribes ? ensureArray(fbSeason.customTribes) : null;

                                    setSeasonData(prev => {
                                        const activeContestants = (fbContestants && fbContestants.length > 0)
                                            ? fbContestants
                                            : ((localData?.contestants && ensureArray(localData.contestants).length > 0)
                                                ? ensureArray(localData.contestants)
                                                : (prev?.contestants && prev.contestants.length > 0 ? prev.contestants : ensureArray(presetData.contestants)));

                                        const activeCustom = (fbCustom && fbCustom.length > 0)
                                            ? fbCustom
                                            : ((localData?.customTribes && ensureArray(localData.customTribes).length > 0)
                                                ? ensureArray(localData.customTribes)
                                                : (prev?.customTribes && prev.customTribes.length > 0 ? prev.customTribes : ensureArray(presetData.customTribes)));

                                        const mergedData = {
                                            ...presetData,
                                            ...fbSeason,
                                            contestants: activeContestants,
                                            customTribes: activeCustom
                                        };
                                        localStorage.setItem(`survivor-seasonData-${activeSeasonId}`, JSON.stringify(mergedData));
                                        return mergedData;
                                    });
                                }
                            });
                        }
                    })
                    .catch(err => console.warn('Could not load season json, using fallback.', err));

                return () => {
                    if (seasonRef) seasonRef.off();
                };
            }, [activeSeasonId]);

            const saveSeasonDataToFirebase = async (newContestants, newCustomTribes) => {
                const updatedContestants = newContestants !== undefined ? ensureArray(newContestants) : ensureArray(seasonData?.contestants);
                const updatedCustomTribes = newCustomTribes !== undefined ? ensureArray(newCustomTribes) : ensureArray(seasonData?.customTribes);

                const updatedSeasonData = {
                    ...(seasonData || {}),
                    contestants: updatedContestants,
                    customTribes: updatedCustomTribes
                };

                setSeasonData(updatedSeasonData);

                if (window.firebaseInitialized) {
                    await database.ref(`seasons/${activeSeasonId}`).update({
                        contestants: updatedContestants,
                        customTribes: updatedCustomTribes
                    });
                }
                localStorage.setItem(`survivor-seasonData-${activeSeasonId}`, JSON.stringify(updatedSeasonData));
            };

            const getPriorTribe = (player, epNum) => {
                if (!player) return 'Unassigned';
                const ep = parseInt(epNum) || 1;
                if (ep <= 1) {
                    return player.startingTribe || player.tribe || 'Unassigned';
                }
                return typeof getTribeForEpisode === 'function' ? getTribeForEpisode(player, ep - 1) : (player.tribe || player.startingTribe || 'Unassigned');
            };

            const handleOpenSingleTribeEdit = (player) => {
                setEditingPlayer(player);
                const defEp = getSmartDefaultEpisode(scoredEpisodes, currentEpisode);
                setSingleEditEpisode(defEp);
                const currentTribeForEp = getTribeForEpisode(player, defEp) || player.tribe || player.startingTribe || '';
                setSingleEditTribe(currentTribeForEp);
            };

            const handleSaveSingleTribeEdit = () => {
                if (!editingPlayer || !singleEditTribe) return;

                const epNum = parseInt(singleEditEpisode) || 1;
                const priorTribe = getPriorTribe(editingPlayer, epNum);
                if (singleEditTribe.trim().toLowerCase() === priorTribe.trim().toLowerCase()) {
                    return; // Do not allow saving swap to the same tribe
                }

                const rawContestants = seasonData?.contestants;
                const contestantList = (rawContestants && ensureArray(rawContestants).length > 0)
                    ? ensureArray(rawContestants)
                    : ensureArray(defaultSeason51Players);

                const pIdx = contestantList.findIndex(p => String(p.id) === String(editingPlayer.id));
                if (pIdx === -1) {
                    console.warn('Could not find player in contestant list:', editingPlayer);
                    return;
                }

                const playerObj = { ...contestantList[pIdx] };
                const history = playerObj.tribeHistory ? [...playerObj.tribeHistory] : [
                    { episode: 1, tribe: playerObj.startingTribe || playerObj.tribe || 'Unassigned', type: 'starting', label: `Starting Tribe: ${playerObj.startingTribe || playerObj.tribe}` }
                ];

                const isMerge = singleEditTribe.toLowerCase().includes('merge');
                const eventType = isMerge ? 'Merged' : (epNum === 1 ? 'starting' : 'Tribe Swap');
                const eventLabel = isMerge ? `Merged into ${singleEditTribe}` : (epNum === 1 ? `Starting Tribe: ${singleEditTribe}` : `Tribe Swap to ${singleEditTribe}`);

                const existingIdx = history.findIndex(h => parseInt(h.episode) === epNum);
                if (existingIdx !== -1) {
                    history[existingIdx] = { episode: epNum, tribe: singleEditTribe, type: eventType, label: eventLabel };
                } else {
                    history.push({ episode: epNum, tribe: singleEditTribe, type: eventType, label: eventLabel });
                }

                history.sort((a, b) => (parseInt(a.episode) || 1) - (parseInt(b.episode) || 1));
                playerObj.tribeHistory = history;

                if (epNum === 1) {
                    playerObj.startingTribe = singleEditTribe;
                }
                playerObj.tribe = getTribeForEpisode(playerObj, 99) || singleEditTribe;

                contestantList[pIdx] = playerObj;
                saveSeasonDataToFirebase(contestantList);
                setEditingPlayer(null);
            };

            const handleRemoveTribeEvent = (targetPlayer, episodeToRemove, eventIndexInProgression) => {
                if (!targetPlayer) return;
                const rawContestants = seasonData?.contestants;
                const contestantList = (rawContestants && ensureArray(rawContestants).length > 0)
                    ? ensureArray(rawContestants)
                    : ensureArray(defaultSeason51Players);

                const pIdx = contestantList.findIndex(p => String(p.id) === String(targetPlayer.id));
                if (pIdx === -1) return;

                const playerObj = { ...contestantList[pIdx] };
                let history = playerObj.tribeHistory ? [...playerObj.tribeHistory] : [
                    { episode: 1, tribe: playerObj.startingTribe || playerObj.tribe || 'Unassigned', type: 'starting', label: `Starting Tribe: ${playerObj.startingTribe || playerObj.tribe}` }
                ];

                if (eventIndexInProgression !== undefined && eventIndexInProgression >= 0 && eventIndexInProgression < history.length) {
                    history.splice(eventIndexInProgression, 1);
                } else {
                    history = history.filter(h => parseInt(h.episode) !== parseInt(episodeToRemove));
                }

                history.sort((a, b) => (parseInt(a.episode) || 1) - (parseInt(b.episode) || 1));
                playerObj.tribeHistory = history;

                if (history.length > 0) {
                    const firstEp = history[0];
                    if (firstEp && firstEp.tribe) {
                        playerObj.startingTribe = firstEp.tribe;
                    }
                    const lastEp = history[history.length - 1];
                    playerObj.tribe = lastEp ? lastEp.tribe : (playerObj.startingTribe || 'Unassigned');
                } else {
                    playerObj.startingTribe = 'Unassigned';
                    playerObj.tribe = 'Unassigned';
                    playerObj.tribeHistory = [{ episode: 1, tribe: 'Unassigned', type: 'starting', label: 'Starting Tribe: Unassigned' }];
                }

                contestantList[pIdx] = playerObj;
                saveSeasonDataToFirebase(contestantList);
            };

            const handleSaveCustomTribe = () => {
                if (!customTribeName || !customTribeName.trim()) return;
                const cleanName = customTribeName.trim();
                const existingCustom = (seasonData && seasonData.customTribes) ? [...seasonData.customTribes] : [];
                
                if (existingCustom.some(ct => ct.name.toLowerCase() === cleanName.toLowerCase())) {
                    alert('A tribe with this name already exists!');
                    return;
                }

                const palette = PRIMARY_COLOR_PALETTES[customTribeColor] || PRIMARY_COLOR_PALETTES.green;
                const newTribeObj = {
                    id: `tribe-${Date.now()}`,
                    name: cleanName,
                    color: customTribeColor,
                    icon: customTribeEmoji || palette.emoji,
                    badgeBg: palette.badgeBg,
                    badgeText: palette.badgeText,
                    badgeBorder: palette.badgeBorder,
                    gradient: palette.gradient
                };

                const updatedCustom = [...existingCustom, newTribeObj];
                saveSeasonDataToFirebase(undefined, updatedCustom);
                if (editingPlayer) {
                    setSingleEditTribe(cleanName);
                }
                setShowAddCustomTribeModal(false);
                setCustomTribeName('');
            };

            const handleOpenBulkEdit = () => {
                const defEp = getSmartDefaultEpisode(scoredEpisodes, currentEpisode);
                setBulkEditEpisode(defEp);
                
                const initialMap = {};
                players.forEach(p => {
                    const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                    if (!elimEp || parseInt(elimEp) >= parseInt(defEp)) {
                        initialMap[p.id] = getTribeForEpisode(p, defEp);
                    }
                });
                setBulkAssignments(initialMap);
                setShowBulkEditModal(true);
            };

            const handleBulkEpisodeChange = (newEp) => {
                setBulkEditEpisode(newEp);
                const updatedMap = {};
                players.forEach(p => {
                    const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                    if (!elimEp || parseInt(elimEp) >= parseInt(newEp)) {
                        updatedMap[p.id] = getTribeForEpisode(p, newEp);
                    }
                });
                setBulkAssignments(updatedMap);
            };

            const handleSaveBulkEdit = () => {
                const rawContestants = seasonData?.contestants;
                const contestantList = (rawContestants && ensureArray(rawContestants).length > 0)
                    ? ensureArray(rawContestants)
                    : ensureArray(defaultSeason51Players);
                const epNum = parseInt(bulkEditEpisode) || 1;

                const updatedContestants = contestantList.map(p => {
                    const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                    if (elimEp && parseInt(elimEp) < epNum) return p; // Skip players eliminated before target episode

                    const newTribe = bulkAssignments[p.id] || bulkAssignments[String(p.id)];
                    if (!newTribe) return p;

                    const priorTribe = getPriorTribe(p, epNum);
                    const isSame = newTribe.trim().toLowerCase() === priorTribe.trim().toLowerCase();

                    let history = p.tribeHistory ? [...p.tribeHistory] : [
                        { episode: 1, tribe: p.startingTribe || p.tribe || 'Unassigned', type: 'starting', label: `Starting Tribe: ${p.startingTribe || p.tribe}` }
                    ];

                    if (epNum === 1) {
                        const existingIdx = history.findIndex(h => parseInt(h.episode) === 1);
                        const startEntry = { episode: 1, tribe: newTribe, type: 'starting', label: `Starting Tribe: ${newTribe}` };
                        if (existingIdx !== -1) {
                            history[existingIdx] = startEntry;
                        } else {
                            history.push(startEntry);
                        }
                    } else {
                        const existingIdx = history.findIndex(h => parseInt(h.episode) === epNum);
                        if (isSame) {
                            // If selected tribe is identical to priorTribe, remove any existing swap entry for epNum
                            if (existingIdx !== -1) {
                                history.splice(existingIdx, 1);
                            }
                        } else {
                            const isMerge = newTribe.toLowerCase().includes('merge');
                            const eventType = isMerge ? 'Merged' : 'Tribe Swap';
                            const eventLabel = isMerge ? `Merged into ${newTribe}` : `Tribe Swap to ${newTribe}`;
                            const swapEntry = { episode: epNum, tribe: newTribe, type: eventType, label: eventLabel };

                            if (existingIdx !== -1) {
                                history[existingIdx] = swapEntry;
                            } else {
                                history.push(swapEntry);
                            }
                        }
                    }

                    history.sort((a, b) => (parseInt(a.episode) || 1) - (parseInt(b.episode) || 1));
                    const updatedP = { ...p, tribeHistory: history };
                    if (epNum === 1) updatedP.startingTribe = newTribe;
                    updatedP.tribe = getTribeForEpisode(updatedP, 99) || newTribe;
                    return updatedP;
                });

                saveSeasonDataToFirebase(updatedContestants);
                setShowBulkEditModal(false);
            };

            const handleConfirmMergeAll = async () => {
                const epNum = parseInt(bulkEditEpisode) || 1;
                const rawContestants = seasonData?.contestants;
                const contestantList = (rawContestants && ensureArray(rawContestants).length > 0)
                    ? ensureArray(rawContestants)
                    : ensureArray(defaultSeason51Players);
                
                // Active non-eliminated players as of epNum
                const activePlayersToMerge = contestantList.filter(p => {
                    const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                    return !elimEp || parseInt(elimEp) >= epNum;
                });

                const mergeTribeName = 'Merge Tribe';

                const updatedContestants = contestantList.map(p => {
                    const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                    if (elimEp && parseInt(elimEp) < epNum) return p; // Skip eliminated players

                    const history = p.tribeHistory ? [...p.tribeHistory] : [
                        { episode: 1, tribe: p.startingTribe || p.tribe || 'Unassigned', type: 'starting', label: `Starting Tribe: ${p.startingTribe || p.tribe}` }
                    ];

                    const existingIdx = history.findIndex(h => parseInt(h.episode) === epNum);
                    const mergeEntry = { episode: epNum, tribe: mergeTribeName, type: 'Merged', label: `Merged into ${mergeTribeName}` };
                    if (existingIdx !== -1) {
                        history[existingIdx] = mergeEntry;
                    } else {
                        history.push(mergeEntry);
                    }

                    history.sort((a, b) => (parseInt(a.episode) || 1) - (parseInt(b.episode) || 1));
                    const updatedP = { ...p, tribeHistory: history };
                    updatedP.tribe = getTribeForEpisode(updatedP, 99);
                    return updatedP;
                });

                // Award +10 Merge Points ("Makes It to the Merge", id: "made-merge") idempotently across active leagues
                if (window.firebaseInitialized) {
                    const promises = [];
                    const scoreId = `merge-bonus-${epNum}`;
                    const activeLeagues = Object.keys(LEAGUES_DATA);

                    activePlayersToMerge.forEach(p => {
                        activeLeagues.forEach(lId => {
                            const scoreRef = database.ref(`leagues/${lId}/seasons/${activeSeasonId}/scores/${p.id}/${epNum}/${scoreId}`);
                            promises.push(scoreRef.set({
                                category: 'Makes It to the Merge',
                                points: 10,
                                note: 'Merged Tribe Bonus 🏝️'
                            }));
                        });
                    });

                    await Promise.all(promises);
                }

                await saveSeasonDataToFirebase(updatedContestants);
                setShowConfirmMergeModal(false);
                setShowBulkEditModal(false);
            };

            const isFinishedSeason = (seasonData && seasonData.status === 'finished') || (seasonConfig && seasonConfig.status === 'previous') || activeSeasonId === 'season-50';

            // Firebase real-time sync for draftState
            useEffect(() => {
                if (!window.firebaseInitialized) {
                    const saved = localStorage.getItem(`survivor-draftState-${activeLeagueId}-${activeSeasonId}`);
                    if (saved) {
                        setDraftState(JSON.parse(saved));
                    } else {
                        const initialOrder = teams.map(t => t.id);
                        const initialBudgets = teams.reduce((acc, t) => ({ ...acc, [t.id]: 100 }), {});
                        setDraftState({
                            status: 'closed',
                            style: 'snake',
                            orderType: 'random',
                            backfillEnabled: true,
                            currentRound: 1,
                            currentPick: 1,
                            lastPickTimestamp: Date.now(),
                            onTheClockTeamId: initialOrder[0] || null,
                            orderSequence: initialOrder,
                            budgets: initialBudgets,
                            backfilledPlayers: {}
                        });
                    }
                    return;
                }
                const unsubscribe = api.subscribeDraftState(activeLeagueId, activeSeasonId, (data) => {
                    if (data) {
                        setDraftState(data);
                    } else {
                        const initialOrder = teams.map(t => t.id);
                        const initialBudgets = teams.reduce((acc, t) => ({ ...acc, [t.id]: 100 }), {});
                        const initial = {
                            status: 'closed',
                            style: 'snake',
                            orderType: 'random',
                            backfillEnabled: true,
                            currentRound: 1,
                            currentPick: 1,
                            lastPickTimestamp: Date.now(),
                            onTheClockTeamId: initialOrder[0] || null,
                            orderSequence: initialOrder,
                            budgets: initialBudgets,
                            backfilledPlayers: {}
                        };
                        setDraftState(initial);
                        api.updateDraftState(activeLeagueId, activeSeasonId, initial);
                    }
                });
                return () => unsubscribe();
            }, [activeLeagueId, activeSeasonId, teams]);

            const updateDraftStateFB = (newState) => {
                setDraftState(newState);
                if (window.firebaseInitialized) {
                    api.updateDraftState(activeLeagueId, activeSeasonId, newState);
                } else {
                    localStorage.setItem(`survivor-draftState-${activeLeagueId}-${activeSeasonId}`, JSON.stringify(newState));
                }
            };

            // Live Pick Timer Interval
            useEffect(() => {
                if (draftState.status !== 'open' || !draftState.lastPickTimestamp) {
                    setElapsedSeconds(0);
                    return;
                }
                const updateTimer = () => {
                    const now = Date.now();
                    const diff = Math.max(0, Math.floor((now - draftState.lastPickTimestamp) / 1000));
                    setElapsedSeconds(diff);
                };
                updateTimer();
                const interval = setInterval(updateTimer, 1000);
                return () => clearInterval(interval);
            }, [draftState.status, draftState.lastPickTimestamp]);

            // Firebase real-time sync per league & season for teams
            useEffect(() => {
                if (!window.firebaseInitialized) {
                    const saved = localStorage.getItem(`survivor-teams-${activeLeagueId}-${activeSeasonId}`);
                    if (saved) {
                        setPlayerTeams(JSON.parse(saved));
                    }
                    return;
                }
                
                const seasonBasePath = `leagues/${activeLeagueId}/seasons/${activeSeasonId}`;
                const teamsRef = database.ref(`${seasonBasePath}/teams`);
                
                teamsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        setPlayerTeams(data);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        // Legacy fallback for Season 50 in main league
                        database.ref('leagues/jackson-ryan-league/teams').once('value').then(snap => {
                            if (snap.val()) setPlayerTeams(snap.val());
                            else database.ref('teams').once('value').then(legacySnap => setPlayerTeams(legacySnap.val() || {}));
                        });
                    } else {
                        setPlayerTeams({});
                    }
                });
                
                return () => teamsRef.off();
            }, [activeLeagueId, activeSeasonId]);
            
            const updateFirebase = (newTeams) => {
                if (window.firebaseInitialized) {
                    database.ref(`leagues/${activeLeagueId}/seasons/${activeSeasonId}/teams`).set(newTeams);
                    if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('leagues/jackson-ryan-league/teams').set(newTeams);
                    }
                } else {
                    localStorage.setItem(`survivor-teams-${activeLeagueId}-${activeSeasonId}`, JSON.stringify(newTeams));
                }
            };

                    return { id: t.id, name: t.name, points: sc.points, immunities: sc.immunities, isNew: !!sc.newManager };
                });

                const returning = mappedTeams.filter(t => !t.isNew);
                const newManagers = mappedTeams.filter(t => t.isNew);

                returning.sort((a, b) => {
                    if (a.points !== b.points) return a.points - b.points;
                    return b.immunities - a.immunities;
                });

                const shuffledNew = [...newManagers].sort(() => 0.5 - Math.random());

                        h('div', { className: 'bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-2 border-orange-500/40 relative' },
                            h('button', {
                                onClick: () => setEditingPlayer(null),
                                className: 'absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold'
                            }, '✕'),

                            h('div', { className: 'flex items-center gap-3 mb-4 pb-3 border-b border-gray-100' },
                                h('img', { src: editingPlayer.image, className: 'w-14 h-14 rounded-full object-cover border-2 border-orange-500 shadow-md' }),
                                h('div', {},
                                    h('h3', { className: 'text-2xl font-black text-gray-900', style: { fontFamily: '"Bebas Neue", cursive' } }, editingPlayer.name),
                                    h('div', { className: 'text-xs text-gray-500 font-semibold' }, `Current Tribe: ${editingPlayer.tribe || editingPlayer.startingTribe || 'Unassigned'}`)
                                )
                            ),

                            h('div', { className: 'bg-amber-50 text-amber-900 border border-amber-300 p-3 rounded-xl text-xs font-semibold mb-4 flex items-center gap-2' },
                                h('span', { className: 'text-base' }, '🌐'),
                                h('span', {}, 'Season-Wide: Tribe changes apply globally across all leagues playing this season.')
                            ),

                            h('div', { className: 'space-y-4 mb-6' },
                                h('div', {},
                                    h('label', { className: 'block text-xs font-bold text-gray-700 uppercase mb-1' }, 'Effective Episode'),
                                    h('select', {
                                        value: singleEditEpisode,
                                        onChange: (e) => {
                                            const newEp = parseInt(e.target.value);
                                            setSingleEditEpisode(newEp);
                                            if (editingPlayer) {
                                                const tr = getTribeForEpisode(editingPlayer, newEp) || editingPlayer.tribe || editingPlayer.startingTribe || '';
                                                setSingleEditTribe(tr);
                                            }
                                        },
                                        className: 'w-full px-4 py-2.5 bg-gray-50 border-2 border-gray-300 rounded-xl font-bold text-sm focus:border-orange-500 focus:outline-none'
                                    },
                                        Array.from({ length: 14 }, (_, i) => i + 1).map(ep => 
                                            h('option', { key: ep, value: ep }, `Episode ${ep}`)
                                        )
                                    )
                                ),

                                h('div', {},
                                    h('div', { className: 'flex justify-between items-center mb-1' },
                                        h('label', { className: 'block text-xs font-bold text-gray-700 uppercase' }, 'Select Tribe'),
                                        singleEditTribe && singleEditTribe !== 'ADD_NEW_TRIBE' && h('div', { className: `px-2.5 py-0.5 rounded-full text-xs font-bold flex items-center gap-1.5 ${getTribeBadgeColor(singleEditTribe)} shadow-xs` },
                                            getTribeIcon(singleEditTribe),
                                            h('span', {}, singleEditTribe)
                                        )
                                    ),
                                    h('select', {
                                        value: singleEditTribe,
                                        onChange: (e) => {
                                            const val = e.target.value;
                                            if (val === 'ADD_NEW_TRIBE') {
                                                setShowAddCustomTribeModal(true);
                                            } else {
                                                setSingleEditTribe(val);
                                            }
                                        },
                                        className: 'w-full px-4 py-2.5 bg-gray-50 border-2 border-gray-300 rounded-xl font-bold text-sm focus:border-orange-500 focus:outline-none'
                                    },
                                        availableTribes.map(t =>
                                            h('option', { key: t, value: t }, t)
                                        ),
                                        h('option', { value: 'ADD_NEW_TRIBE', className: 'font-bold text-orange-600' }, '➕ Add New Custom Tribe...')
                                    )
                                ),

                                (() => {
                                    const epNum = parseInt(singleEditEpisode) || 1;
                                    const priorTribe = getPriorTribe(editingPlayer, epNum);
                                    const isSameTribe = singleEditTribe && priorTribe && (singleEditTribe.trim().toLowerCase() === priorTribe.trim().toLowerCase());
                                    return isSameTribe ? h('div', { className: 'p-3 bg-amber-50 text-amber-900 border border-amber-300 rounded-xl text-xs font-bold flex items-center gap-2' },
                                        h('span', { className: 'text-sm' }, '⚠️'),
                                        h('span', {}, `Contestant is already on the ${priorTribe} tribe for Episode ${epNum}. Select a different tribe to save.`)
                                    ) : (
                                        epNum > 1 && h('div', { className: 'text-[11px] text-gray-500 italic' },
                                            `Tribe assignment for episodes prior to Episode ${epNum} will remain unchanged.`
                                        )
                                    );
                                })()
                            ),

                            h('div', { className: 'flex gap-2' },
                                h('button', {
                                    onClick: () => setEditingPlayer(null),
                                    className: 'w-1/2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold rounded-xl text-sm transition border border-slate-600/80 shadow-sm cursor-pointer'
                                }, 'Cancel'),
                                (() => {
                                    const epNum = parseInt(singleEditEpisode) || 1;
                                    const priorTribe = getPriorTribe(editingPlayer, epNum);
                                    const isSameTribe = singleEditTribe && priorTribe && (singleEditTribe.trim().toLowerCase() === priorTribe.trim().toLowerCase());
                                    return h('button', {
                                        onClick: handleSaveSingleTribeEdit,
                                        disabled: isSameTribe,
                                        className: `w-1/2 px-4 py-2.5 font-bold rounded-xl text-sm shadow-md transition ${
                                            isSameTribe 
                                                ? 'bg-gray-300 text-gray-400 cursor-not-allowed border border-gray-300 shadow-none' 
                                                : 'bg-gradient-to-r from-orange-500 to-amber-600 text-white hover:shadow-lg cursor-pointer'
                                        }`
                                    }, 'Save Tribe');
                                })()
                            )
                        )
                    ),

                    // 2. Add Custom Tribe Sub-Modal
                    showAddCustomTribeModal && h('div', { className: 'fixed inset-0 bg-black/85 backdrop-blur-sm z-[60] flex items-center justify-center p-4' },
                        h('div', { className: 'bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border-2 border-emerald-500/40 relative' },
                            h('h3', { className: 'text-2xl font-black text-gray-900 mb-1', style: { fontFamily: '"Bebas Neue", cursive' } }, '➕ Add New Custom Tribe'),
                            h('p', { className: 'text-xs text-gray-500 mb-4' }, 'Create a new tribe with custom name and primary color theme.'),

                            h('div', { className: 'space-y-4 mb-6' },
                                h('div', {},
                                    h('label', { className: 'block text-xs font-bold text-gray-700 uppercase mb-1' }, 'Tribe Name'),
                                    h('input', {
                                        type: 'text',
                                        placeholder: 'e.g., Vatu, Exile, Manu',
                                        value: customTribeName,
                                        onChange: (e) => setCustomTribeName(e.target.value),
                                        className: 'w-full px-4 py-2.5 bg-gray-50 border-2 border-gray-300 rounded-xl font-bold text-sm focus:border-emerald-500 focus:outline-none'
                                    })
                                ),

                                h('div', {},
                                    h('label', { className: 'block text-xs font-bold text-gray-700 uppercase mb-1' }, 'Primary Color Theme'),
                                    h('div', { className: 'grid grid-cols-4 gap-2' },
                                        Object.values(PRIMARY_COLOR_PALETTES).map(pal => 
                                            h('button', {
                                                key: pal.id,
                                                type: 'button',
                                                onClick: () => {
                                                    setCustomTribeColor(pal.id);
                                                    setCustomTribeEmoji('');
                                                },
                                                className: `p-2.5 rounded-xl text-center border-2 transition ${pal.cardBg} ${
                                                    customTribeColor === pal.id ? `${pal.borderColor} ring-2 ring-emerald-500 font-bold scale-105` : 'border-transparent opacity-80'
                                                }`
                                            },
                                                h('div', { className: `w-5 h-5 rounded-full mx-auto shadow-xs ${pal.dotBg}` }),
                                                h('div', { className: `text-[9px] font-black uppercase mt-1.5 ${pal.badgeText}` }, pal.id)
                                            )
                                        )
                                    )
                                )
                            ),

                            h('div', { className: 'flex gap-2' },
                                h('button', {
                                    onClick: () => setShowAddCustomTribeModal(false),
                                    className: 'w-1/2 px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold rounded-xl text-sm transition border border-slate-600/80 shadow-sm cursor-pointer'
                                }, 'Cancel'),
                                h('button', {
                                    onClick: handleSaveCustomTribe,
                                    className: 'w-1/2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md cursor-pointer'
                                }, 'Save Tribe')
                            )
                        )
                    ),

                    // 3. Visual Drag & Drop Bulk Tribe Edit Modal
                    showBulkEditModal && h('div', { className: 'fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 md:p-6 overflow-y-auto' },
                        h('div', { className: 'bg-slate-900 rounded-3xl max-w-5xl w-full p-6 text-white shadow-2xl border-2 border-orange-500/50 max-h-[90vh] flex flex-col justify-between' },
                            h('div', {},
                                // Header Bar
                                h('div', { className: 'flex justify-between items-center mb-4 pb-3 border-b border-slate-800 flex-wrap gap-2' },
                                    h('div', { className: 'flex items-center gap-2' },
                                        h('span', { className: 'text-3xl' }, '🏕️'),
                                        h('div', {},
                                            h('h2', { className: 'text-3xl font-black text-amber-400 uppercase tracking-wider', style: { fontFamily: '"Bebas Neue", cursive' } }, 'EDIT TRIBES (VISUAL BULK DASHBOARD)'),
                                            h('p', { className: 'text-xs text-slate-400 font-semibold' }, 'Drag & Drop players into tribe shape containers. Click "Save Changes" to apply season-wide.')
                                        )
                                    ),
                                    h('div', { className: 'flex items-center gap-2' },
                                        h('button', {
                                            onClick: () => setShowAddCustomTribeModal(true),
                                            className: 'px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold rounded-xl border border-amber-500/40 text-xs flex items-center gap-1 cursor-pointer'
                                        }, '➕ Add Tribe'),
                                        h('button', {
                                            onClick: () => setShowConfirmMergeModal(true),
                                            className: 'px-3 py-1.5 bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-500 hover:to-indigo-600 text-white font-bold rounded-xl text-xs flex items-center gap-1 shadow-md cursor-pointer'
                                        }, '🤝 Merge All Players'),
                                        h('button', {
                                            onClick: () => setShowBulkEditModal(false),
                                            className: 'p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white transition'
                                        }, '✕')
                                    )
                                ),

                                // Target Episode Selector
                                h('div', { className: 'flex items-center justify-between mb-4 bg-slate-950/80 p-3 rounded-2xl border border-slate-800 flex-wrap gap-2' },
                                    h('div', { className: 'flex items-center gap-2' },
                                        h('span', { className: 'text-xs font-bold text-slate-400 uppercase' }, 'Target Episode:'),
                                        h('select', {
                                            value: bulkEditEpisode,
                                            onChange: (e) => handleBulkEpisodeChange(parseInt(e.target.value)),
                                            className: 'px-3 py-1.5 bg-slate-800 text-amber-300 font-bold rounded-xl border border-amber-500/40 text-xs focus:outline-none cursor-pointer'
                                        },
                                            Array.from({ length: 14 }, (_, i) => i + 1).map(ep => 
                                                h('option', { key: ep, value: ep }, `Episode ${ep}`)
                                            )
                                        )
                                    ),
                                    h('div', { className: 'text-xs text-amber-400/90 font-semibold' }, `🖐️ Drag player buttons between containers below:`)
                                ),

                                // Tribe Shape Containers Grid
                                (() => {
                                    const activePlayersForEp = players.filter(p => {
                                        const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                                        return !elimEp || parseInt(elimEp) >= parseInt(bulkEditEpisode);
                                    });

                                    return h('div', { className: 'grid md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[55vh] overflow-y-auto pr-1' },
                                        availableTribes.map(tribeName => {
                                            const style = getTribeStyle(tribeName, customTribesList);
                                            const assignedPlayerIds = Object.keys(bulkAssignments).filter(id => bulkAssignments[id] === tribeName);
                                            const assignedPlayersList = activePlayersForEp.filter(p => assignedPlayerIds.includes(String(p.id)) || assignedPlayerIds.includes(p.id));

                                            return h('div', {
                                                key: tribeName,
                                                onDragOver: (e) => e.preventDefault(),
                                                onDrop: (e) => {
                                                    e.preventDefault();
                                                    if (draggedPlayerId) {
                                                        setBulkAssignments(prev => ({ ...prev, [draggedPlayerId]: tribeName }));
                                                        setDraggedPlayerId(null);
                                                    }
                                                },
                                                className: `rounded-2xl p-4 border-2 ${style.borderColor} ${style.cardBg} transition-all duration-200 flex flex-col justify-between shadow-lg`
                                            },
                                            h('div', {},
                                                // Tribe Shape Header
                                                h('div', { className: `p-2.5 rounded-xl bg-gradient-to-r ${style.gradient} text-white flex justify-between items-center mb-3 shadow-md` },
                                                    h('div', { className: 'flex items-center gap-2 font-black text-sm tracking-wider uppercase' },
                                                        h('span', { className: `w-3 h-3 rounded-full inline-block shrink-0 border border-white/40 shadow-xs ${style.dotBg}` }),
                                                        h('span', {}, tribeName)
                                                    ),
                                                    h('span', { className: 'text-xs font-extrabold bg-white/20 backdrop-blur-sm px-2 py-0.5 rounded-full' }, `${assignedPlayersList.length} player(s)`)
                                                ),

                                                // Player Name Buttons Box
                                                h('div', { className: 'flex flex-wrap gap-2 min-h-[80px] p-2 bg-slate-950/40 rounded-xl border border-slate-800/80 items-start' },
                                                    assignedPlayersList.length === 0 ?
                                                        h('div', { className: 'w-full text-center text-xs text-slate-500 italic py-4' }, 'Drag players here') :
                                                        assignedPlayersList.map(p => 
                                                            h('div', {
                                                                key: p.id,
                                                                draggable: true,
                                                                onDragStart: () => setDraggedPlayerId(p.id),
                                                                className: 'px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-xl font-bold text-xs border border-amber-500/40 cursor-grab active:cursor-grabbing shadow-sm flex items-center gap-1.5 transition transform hover:scale-105'
                                                            },
                                                                h('img', { src: p.image, className: 'w-5 h-5 rounded-full object-cover border border-white' }),
                                                                h('span', {}, p.name)
                                                            )
                                                        )
                                                )
                                            )
                                        );
                                    })
                                )
                            })()
                            ),

                            // Modal Footer Controls
                            h('div', { className: 'flex justify-between items-center pt-4 border-t border-slate-800 mt-4 flex-wrap gap-2' },
                                h('div', { className: 'text-xs text-slate-400 font-medium' }, 'Changes will be saved to season configuration across all leagues.'),
                                h('div', { className: 'flex gap-2' },
                                    h('button', {
                                        onClick: () => setShowBulkEditModal(false),
                                        className: 'px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition'
                                    }, 'Cancel'),
                                    h('button', {
                                        onClick: handleSaveBulkEdit,
                                        className: 'px-6 py-2.5 bg-gradient-to-r from-orange-500 to-amber-600 text-white font-bold rounded-xl text-sm shadow-lg hover:shadow-xl transition'
                                    }, 'Save Changes')
                                )
                            )
                        )
                    ),

                    // 4. Confirm Merge Modal
                    showConfirmMergeModal && h('div', { className: 'fixed inset-0 bg-black/90 backdrop-blur-md z-[70] flex items-center justify-center p-4' },
                        h('div', { className: 'bg-slate-900 rounded-3xl max-w-lg w-full p-6 text-white shadow-2xl border-2 border-purple-500/60 relative' },
                            h('div', { className: 'flex items-center gap-3 mb-4 pb-3 border-b border-slate-800' },
                                h('span', { className: 'text-3xl' }, '🤝'),
                                h('div', {},
                                    h('h3', { className: 'text-2xl font-black text-amber-400', style: { fontFamily: '"Bebas Neue", cursive' } }, `CONFIRM MERGE (EPISODE ${bulkEditEpisode})`),
                                    h('p', { className: 'text-xs text-slate-400 font-semibold' }, 'Shift all active players to Merge Tribe & award Merge points.')
                                )
                            ),

                            h('div', { className: 'bg-purple-950/80 text-purple-200 border border-purple-500/40 p-3 rounded-xl text-xs font-semibold mb-4 space-y-1' },
                                h('div', { className: 'font-bold text-amber-300' }, '🏆 Automated Merge Actions:'),
                                h('div', {}, `• Reassigns all active non-eliminated players to "Merge Tribe" starting Episode ${bulkEditEpisode}.`),
                                h('div', {}, `• Awards +10 Merge Points ("Makes It to the Merge") idempotently in score logs for all active leagues.`)
                            ),

                            h('div', { className: 'mb-4' },
                                h('label', { className: 'block text-xs font-bold text-slate-300 uppercase mb-2' }, 'Contestants Scheduled for Merge:'),
                                h('div', { className: 'flex flex-wrap gap-2 max-h-40 overflow-y-auto p-2 bg-slate-950/80 rounded-xl border border-slate-800' },
                                    players.filter(p => {
                                        const elimEp = eliminationOrder && (eliminationOrder[p.id] || eliminationOrder[String(p.id)]);
                                        return !elimEp || parseInt(elimEp) >= parseInt(bulkEditEpisode);
                                    }).map(p =>
                                        h('div', { key: p.id, className: 'px-2.5 py-1 bg-purple-900/60 border border-purple-400/30 rounded-lg text-xs font-bold text-purple-200 flex items-center gap-1.5' },
                                            h('img', { src: p.image, className: 'w-4 h-4 rounded-full object-cover' }),
                                            h('span', {}, p.name)
                                        )
                                    )
                                )
                            ),

                            h('div', { className: 'flex gap-2' },
                                h('button', {
                                    onClick: () => setShowConfirmMergeModal(false),
                                    className: 'w-1/2 px-4 py-2.5 bg-slate-800 text-slate-300 font-bold rounded-xl text-sm hover:bg-slate-700'
                                }, 'Cancel'),
                                h('button', {
                                    onClick: handleConfirmMergeAll,
                                    className: 'w-1/2 px-4 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-700 hover:from-purple-500 hover:to-indigo-600 text-white font-bold rounded-xl text-sm shadow-lg'
                                }, 'Execute Merge 🤝')
                            )
                        )
                    )
                )
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(SurvivorFantasyLeague));
    }
    </script>
    
    <!-- PWA Service Worker -->
    <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
            .then((registration) => {
                console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
                console.error('Service Worker registration failed:', error);
            });
    }

    // Detect if running as installed PWA
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running as installed PWA');
    }
    </script>
</body>
